name: PR73 integration diagnostics
on:
  push:
    branches: [feat/curated-station-colour]
    paths: [.github/workflows/pr73-repair.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'c933103/openrailwaystyle' && github.ref == 'refs/heads/feat/curated-station-colour'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 150
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare credential-free source snapshots
        run: |
          git fetch --no-tags --depth=150 origin main:refs/remotes/origin/main
          mkdir -p /tmp/pr73-sources
          git rev-parse HEAD origin/main $(git merge-base HEAD origin/main) > /tmp/pr73-sources/refs.txt
          git archive --format=tar.gz --output=/tmp/pr73-sources/head.tar.gz HEAD
          git archive --format=tar.gz --output=/tmp/pr73-sources/main.tar.gz origin/main
          git archive --format=tar.gz --output=/tmp/pr73-sources/base.tar.gz $(git merge-base HEAD origin/main)
          npm ci --ignore-scripts --no-audit --no-fund
          tar -czf /tmp/pr73-sources/dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: pr73-source-snapshots
          path: /tmp/pr73-sources
          retention-days: 1
