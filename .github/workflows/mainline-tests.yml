name: Check independent railway reference failures and rendering
on:
  pull_request:
    paths: ['tests/fixtures/browser-glyphs/0-255.pbf', 'scripts/serve.mjs', 'scripts/build-style.mjs', 'styles/data-src/major-stations.json', 'scripts/*mainline*', 'scripts/browser*.mjs', 'styles/mainline-reference.mjs', 'styles/world.style.json', 'tests/mainline*.mjs', '.github/workflows/mainline-tests.yml', '.github/workflows/mainline-reference.yml', '.github/workflows/mainline-reference-completed.yml', '.github/workflows/site.yml']
  push:
    branches: [main, feat/world-mainline-overview-source-20261011]
    paths: ['tests/fixtures/browser-glyphs/0-255.pbf', 'scripts/serve.mjs', 'scripts/build-style.mjs', 'styles/data-src/major-stations.json', 'scripts/*mainline*', 'scripts/browser*.mjs', 'styles/mainline-reference.mjs', 'styles/world.style.json', 'tests/mainline*.mjs', '.github/workflows/mainline-tests.yml', '.github/workflows/mainline-reference.yml', '.github/workflows/mainline-reference-completed.yml', '.github/workflows/site.yml']
permissions:
  contents: read
concurrency:
  group: mainline-tests-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true
jobs:
  independent-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/mainline*.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Render synthetic failure, filter and zoom controls independently of source acquisition
        run: |
          node scripts/serve.mjs &
          node scripts/check-mainline-reference-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mainline-independent-renderer-diagnostics
          path: browser-review
          retention-days: 14
