name: Check independent railway reference failures and rendering
on:
  pull_request:
    paths: ['scripts/*mainline*', 'scripts/browser*.mjs', 'styles/mainline-reference.mjs', 'styles/world.style.json', 'tests/mainline*.mjs', '.github/workflows/mainline-tests.yml']
  push:
    branches: [main, feat/world-mainline-overview-source-20261011]
    paths: ['scripts/*mainline*', 'scripts/browser*.mjs', 'styles/mainline-reference.mjs', 'styles/world.style.json', 'tests/mainline*.mjs', '.github/workflows/mainline-tests.yml']
permissions:
  contents: read
concurrency:
  group: mainline-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  independent-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/mainline-overview.test.mjs tests/mainline-reference.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Render synthetic failure, filter and zoom controls independently of source acquisition
        run: |
          node scripts/serve.mjs &
          node scripts/check-mainline-reference-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mainline-independent-renderer-diagnostics
          path: browser-review
          retention-days: 14
