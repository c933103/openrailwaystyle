name: Refresh worldwide station-point overview
on:
  workflow_dispatch:
  # Each run makes at most one bounded geographic data query.
  schedule:
    - cron: '43 2,8,14,20 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/station-overview.mjs'
      - 'scripts/station-acquisition.mjs'
      - 'scripts/build-station-snapshot.mjs'
      - 'styles/tile-bundles.mjs'
      - '.github/workflows/station-points.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: station-point-snapshot
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore only the private-in-progress acquisition checkpoint
        run: |
          set -eu
          status=0
          git ls-remote --exit-code --heads origin station-points-work >/dev/null || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin station-points-work
            mkdir -p /tmp/station-previous
            git archive FETCH_HEAD -- state.json stations.json.gz | tar -x -C /tmp/station-previous
          elif [ "$status" != 2 ]; then
            echo "Cannot safely check checkpoint branch (status $status)"
            exit "$status"
          fi
      - name: Fetch up to one OSM region and build only if fully complete
        env:
          PREVIOUS_DATA: /tmp/station-previous
        run: |
          if [ -f /tmp/station-previous/state.json ]; then
            node scripts/build-station-snapshot.mjs
          else
            env -u PREVIOUS_DATA node scripts/build-station-snapshot.mjs
          fi
      - name: Verify region topology, records and publication boundary
        id: verify
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,appendFile} from 'node:fs/promises';
          import {gunzipSync} from 'node:zlib';
          import {checkStationAcquisition,stationWorldCoverage} from './scripts/station-acquisition.mjs';
          const state=JSON.parse(await readFile('station-snapshot/state.json','utf8'));
          const rows=JSON.parse(gunzipSync(await readFile('station-snapshot/stations.json.gz')));
          const manifest=JSON.parse(await readFile('station-snapshot/manifest.json','utf8'));
          assert.equal(checkStationAcquisition(state,rows),true);
          const complete=state.pending.length===0&&stationWorldCoverage(state.completed);
          assert.equal(manifest.complete,complete);
          assert.equal(manifest.stations,rows.length);
          assert.equal(manifest.license,'ODbL-1.0');
          if(complete) {
            const index=JSON.parse(await readFile('station-snapshot/index.json','utf8'));
            assert.ok(index.zoom===3&&index.bundles.length>0,'Complete data must include non-empty z3–7 tiles');
            assert.ok(manifest.tiles>0&&manifest.bundles>0);
          }
          await appendFile(process.env.GITHUB_OUTPUT,`complete=${complete}\n`);
          JS
      # Production readers must use ONLY station-points-data; it is never
      # touched by a partial refresh. The complete generation replaces it
      # atomically as one branch update.
      - name: Publish complete worldwide tile generation
        if: steps.verify.outputs.complete == 'true'
        run: |
          set -eu
          mkdir /tmp/station-release
          cd /tmp/station-release
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan station-points-data
          cp -r "$GITHUB_WORKSPACE/station-snapshot/." .
          git add .
          git commit -q -m "Complete worldwide station points $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! git push --force origin HEAD:station-points-data; then
            test "$(git ls-remote origin refs/heads/station-points-data | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      - name: Publish checked in-progress checkpoint without replacing live data
        run: |
          set -eu
          mkdir /tmp/station-publish
          cd /tmp/station-publish
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan station-points-work
          cp "$GITHUB_WORKSPACE/station-snapshot/state.json" .
          cp "$GITHUB_WORKSPACE/station-snapshot/stations.json.gz" .
          cp "$GITHUB_WORKSPACE/station-snapshot/manifest.json" .
          git add .
          git commit -q -m "Station-point acquisition progress $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! git push --force origin HEAD:station-points-work; then
            test "$(git ls-remote origin refs/heads/station-points-work | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      # Only a completed, atomically published generation can update the map.
      - name: Redeploy site after complete OSM station snapshot publication
        if: steps.verify.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main
