name: Prepare railway performance changes
on:
  push:
    branches: [fix/rail-provider-outage-recovery]
    paths:
      - scripts/apply-rail-performance.mjs
      - scripts/finish-rail-performance.mjs
      - scripts/check-rail-overview-browser.mjs
      - .github/workflows/prepare-rail-performance.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: prepare-rail-performance
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'c933103/openrailwaystyle' && github.ref == 'refs/heads/fix/rail-provider-outage-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rail-provider-outage-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Integrate reviewed changes and rebuild artifacts
        run: |
          node scripts/apply-rail-performance.mjs
          node scripts/finish-rail-performance.mjs
      - name: Unit and source contract regressions
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/rail-performance-tests.txt
          node --check styles/app.mjs
          git diff --check
      - name: Install renderer test browser
        run: npx playwright install --with-deps chromium
      - name: Retain the exact pinned renderer for reproducing failures
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          const app=await readFile('styles/app.mjs','utf8');
          const url=/loadScript\('(https:\/\/[^']+maplibre-gl\.js)'/.exec(app)?.[1];
          if(!url)throw new Error('Missing pinned renderer');
          const response=await fetch(url);
          if(!response.ok)throw new Error(`Renderer HTTP ${response.status}`);
          await writeFile('/tmp/rail-performance-maplibre.js',await response.text());
          JS
      - name: Verify negative zoom geometry in the pinned renderer
        run: |
          set -o pipefail
          node scripts/check-rail-overview-browser.mjs 2>&1 | tee /tmp/rail-performance-browser.txt
      - name: Commit verified branch changes and remove one-shot tooling
        run: |
          {
            echo
            echo '## Validation from the branch preparation run'
            echo
            echo '```text'
            grep -E '^# (tests|pass|fail|cancelled|skipped)|RAIL_METADATA_NETWORK_REQUESTS|REQUEST_POOL_BURST' /tmp/rail-performance-tests.txt
            grep '^PASS:' /tmp/rail-performance-browser.txt
            echo '```'
          } >> docs/investigations/rail-loading-20261007.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles tests scripts/check-map-browser.mjs scripts/ci-plan.mjs docs/rendering.md docs/investigations/rail-loading-20261007.md
          git rm scripts/apply-rail-performance.mjs scripts/finish-rail-performance.mjs .github/workflows/prepare-rail-performance.yml
          git commit -m 'Integrate bounded rail loading and verified world-scale visibility'
          git push origin HEAD:fix/rail-provider-outage-recovery
      - name: Run the existing full site validation on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref fix/rail-provider-outage-recovery
      - name: Summarize focused check output
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['rail-performance-tests.txt','rail-performance-browser.txt']:
            p=Path('/tmp')/name
            if not p.exists(): continue
            lines=p.read_text().splitlines()
            print('\n'+name)
            selected=set(range(max(0,len(lines)-12),len(lines)))
            for i,line in enumerate(lines):
              if line.startswith(('not ok','RAIL_OVERVIEW_FAILURE')):
                selected.update(range(max(0,i-1),min(len(lines),i+40)))
            for i in sorted(selected): print(lines[i])
          PY
      - name: Save the tested source tree without credentials or font assets
        if: always()
        run: |
          tar --exclude='styles/fonts' --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' --exclude='node_modules/.cache' -czf /tmp/rail-performance-worktree.tar.gz styles tests scripts docs package.json package-lock.json node_modules
      - name: Save focused renderer and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rail-performance-focused-review
          path: |
            browser-review
            /tmp/rail-performance-tests.txt
            /tmp/rail-performance-browser.txt
            /tmp/rail-performance-maplibre.js
            /tmp/rail-performance-worktree.tar.gz
          if-no-files-found: ignore
