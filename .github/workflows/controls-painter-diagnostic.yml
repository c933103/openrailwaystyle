name: Controls painter diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/controls-painter-diagnostic.yml'
      - 'scripts/check-controls-painter-browser.mjs'
      - 'scripts/controls-painter-*.mjs'
      - 'scripts/diagnose-controls-painter.mjs'
      - 'tests/controls-painter-*.test.mjs'
permissions:
  contents: read
concurrency:
  group: controls-painter-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build with the checked-out source identity
        env:
          ATLAS_DIAGNOSTIC_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ATLAS_DIAGNOSTIC_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: GITHUB_SHA="$ATLAS_DIAGNOSTIC_REF" GITHUB_REPOSITORY="$ATLAS_DIAGNOSTIC_REPOSITORY" npm run build
      - run: git diff --exit-code -- styles/world.style.json
      - run: node --experimental-vm-modules --test tests/controls-painter-*.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Run one fixture-only baseline and guard pair
        env:
          ATLAS_DIAGNOSTIC_HEAD: ${{ github.event.pull_request.head.sha }}
          ATLAS_DIAGNOSTIC_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          mkdir -p browser-review
          node scripts/serve.mjs > browser-review/controls-painter-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node -e 'const end=Date.now()+10000;(async()=>{while(Date.now()<end){try{const r=await fetch("http://127.0.0.1:4173/");if(r.ok)return;}catch{}await new Promise(r=>setTimeout(r,100));}throw new Error("Preview server unavailable");})()'
          node scripts/check-controls-painter-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controls-painter-diagnostic-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: browser-review/
          retention-days: 30
