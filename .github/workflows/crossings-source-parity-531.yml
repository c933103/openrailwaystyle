name: Verify exact published crossing sources for PR 531
on:
  push:
    branches: [evidence/crossings-source-parity-531]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify published branch tables, manifest, and the 15 restored IDs
        shell: bash
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          OLD=d5388a9c883f62ce636b29a47324a14221a066bc
          NEW=be18b7432b5bf2d5bb3cbb2291e5c471317aa050
          git fetch --quiet --depth=1 --filter=blob:none origin "$OLD" "$NEW"
          git show "$OLD:crossings.tsv.gz" > "$d/old.tsv.gz"
          git show "$NEW:crossings.tsv.gz" > "$d/new.tsv.gz"
          git show "$OLD:regions.json" > "$d/regions.json"
          git show "$NEW:source.json" > "$d/source.json"
          git show "$NEW:manifest.json" > "$d/manifest.json"
          git ls-tree -r --name-only "$NEW" > "$d/tree.txt"
          sha256sum "$d/old.tsv.gz" "$d/new.tsv.gz"
          python3 scripts/compare-crossings-531.py "$d" fresh | tee "$d/parity.md" "$GITHUB_STEP_SUMMARY"
          python3 - "$d" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import gzip, json, pathlib, re, sys
          root=pathlib.Path(sys.argv[1])
          source=json.loads((root/"source.json").read_text())
          manifest=json.loads((root/"manifest.json").read_text())
          audit=json.loads((root/"parity.md").read_text().split("```json\n")[1].split("\n```")[0])
          assert source["complete"] and source["source"]=="extract" and source["dataset"]=="crossings"
          assert source["inputSha256"]=="a6d2e6aa00644d58014f03ecd41c6a5a7b2d4c3b7bdb57e7aac52b21f4ee4407"
          assert manifest["complete"] and manifest["tags"] and manifest["extract"]["index"]=="20261126T161713Z-45852008906"
          assert manifest["extract"]["regions"]==175 and not manifest["extract"]["missingRegions"]
          assert manifest["crossings"]==sum(audit["total"][k] for k in ("same row","changed row","only extract"))
          assert not audit["laterOverpassOnly"], audit["laterOverpassOnly"]
          ids=set(map(str,[1349624517,1349624562,1349626718,2589324210,2589324761,2589331165,2738435885,
              3026539692,3331328143,6698312538,6698312572,13879432906,14385085973,14397335253,14397343785]))
          def wanted(path):
              out={}
              with gzip.open(path,"rt") as f:
                  for line in f:
                      parts=line.rstrip("\n").split("\t")
                      if parts[0] in ids:
                          out[parts[0]]=tuple(map(float,parts[1:3]))+(parts[3],)
              return out
          assert len(wanted(root/"new.tsv.gz"))==15 and wanted(root/"new.tsv.gz")==wanted(root/"old.tsv.gz")
          lines=(root/"tree.txt").read_text().splitlines()
          tiles=[p for p in lines if re.search(r"(?:^|/)\d+/\d+/\d+\.pbf$",p)]
          assert len(tiles)==manifest["tiles"], (len(tiles),manifest["tiles"],lines[:20])
          print(f"Published extraction: {manifest['crossings']:,} rows, {len(tiles):,} indexed PBF tiles, 15/15 restored IDs aligned.")
          PY
