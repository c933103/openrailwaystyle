name: PR71 repair diagnostics
on:
  push:
    branches: [fix/attribution-info-compact]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture exact source revisions
        shell: bash
        run: |
          mkdir -p diagnostic
          git archive --format=tar HEAD > diagnostic/pr71.tar
          git rev-parse HEAD > diagnostic/pr71.sha
          git fetch --no-tags --depth=1 origin main
          git rev-parse FETCH_HEAD > diagnostic/main.sha
          git archive --format=tar FETCH_HEAD > diagnostic/main.tar
          git fetch --no-tags --depth=1 origin 3fe8c5bd661684d56de968ee8b5dbc2b44998933
          git archive --format=tar FETCH_HEAD > diagnostic/base.tar
      - name: Capture original failure without embedded images
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/c933103/openrailwaystyle/actions/jobs/111104532810/logs' -o /tmp/pr71.log
          python - <<'PY'
          import pathlib, re
          lines = pathlib.Path('/tmp/pr71.log').read_text(encoding='utf-8-sig').splitlines()
          clean = [line[:1800] for line in lines if not re.search(r'(?:IMAGE|VIEW|CONTEXT|PLANNING).*START/9j/|_STARTiVBOR|data:image', line) and len(line) < 15000]
          pathlib.Path('diagnostic/failure.log').write_text('\n'.join(clean))
          matches = [i for i, line in enumerate(clean) if re.search(r'Error|exceeded|Assertion|FAIL|timed out|Timeout|PASS:', line)]
          keep = sorted({j for i in matches[-45:] for j in range(max(0, i - 2), min(len(clean), i + 6))})
          excerpt = '\n'.join(clean[j] for j in keep)
          pathlib.Path('diagnostic/failure-excerpt.txt').write_text(excerpt)
          print(excerpt[-16000:])
          PY
      - name: Prepare offline test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund maplibre-gl@5.24.0
          tar -czf diagnostic/test-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr71-repair-inputs
          path: diagnostic
          retention-days: 3
