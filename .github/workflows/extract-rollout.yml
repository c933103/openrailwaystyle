name: Continue verified extract filter rollout
on:
  push:
    branches: [main]
    paths:
      - scripts/extract-filter.mjs
      - scripts/extract/extract-filter.mjs
      - scripts/lifecycle.mjs
      - scripts/extract-rollout.mjs
      - .github/workflows/extract-rollout.yml
  workflow_run:
    workflows: [Geofabrik region extracts]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: extract-filter-rollout
  cancel-in-progress: false
jobs:
  continue:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - name: Load the verified working-copy index
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/extract-release.mjs load index.json
      - name: Check required continuation
        id: readiness
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXTRACT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            node scripts/extract-rollout.mjs refresh index.json
          else
            node scripts/extract-rollout.mjs assemble index.json
          fi
      - name: Continue through the existing bounded workflow
        if: steps.readiness.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then workflow=osm-extract.yml; else workflow=osm-assemble.yml; fi
          # Refreshes of the same source can share acquisition work.
          if [ "$EVENT_NAME" = push ]; then
            export ROLLOUT_HEAD=$(git rev-parse HEAD)
            active=$(gh run list --workflow "$workflow" --branch main --limit 100 --json status,headSha --jq '[.[] | select(.status != "completed" and .headSha == env.ROLLOUT_HEAD)] | length')
            if [ "$active" -gt 0 ]; then echo "Existing $workflow run will complete the continuation"; exit 0; fi
          fi
          # An active assembly may already hold an older index. Queue this
          # continuation through its existing non-cancelling concurrency group.
          gh workflow run "$workflow" --ref main
