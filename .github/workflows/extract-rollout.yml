name: Continue verified extract filter rollout
on:
  push:
    branches: [main]
    paths:
      - scripts/extract-filter.mjs
      - scripts/extract/extract-filter.mjs
      - scripts/lifecycle.mjs
      - scripts/extract-rollout.mjs
      - .github/workflows/extract-rollout.yml
      - scripts/extract-refresh-requests/531.json
  workflow_run:
    workflows: [Geofabrik region extracts]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: extract-filter-rollout
  cancel-in-progress: false
jobs:
  continue:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - name: Load the verified working-copy index
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/extract-release.mjs load index.json
      - name: Read the reviewed two-region refresh request
        if: github.event_name == 'push'
        id: targeted
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          request=scripts/extract-refresh-requests/531.json
          # Only this change on trusted main can trigger the refresh. Removal
          # retires it; later unrelated pushes must not repeat it.
          [[ "$PUSH_BEFORE" =~ ^[a-f0-9]{40}$ && "$PUSH_AFTER" =~ ^[a-f0-9]{40}$ ]]
          for sha in "$PUSH_BEFORE" "$PUSH_AFTER"; do
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$sha"
            fi
            git cat-file -e "$sha^{commit}"
          done
          status=0
          git diff --quiet "$PUSH_BEFORE" "$PUSH_AFTER" -- "$request" || status=$?
          if [ "$status" -eq 0 ]; then exit 0; fi
          if [ "$status" -ne 1 ]; then exit "$status"; fi
          echo 'matched=true' >> "$GITHUB_OUTPUT"
          if ! git cat-file -e "$PUSH_AFTER:$request" 2>/dev/null; then exit 0; fi
          git show "$PUSH_AFTER:$request" > targeted-request.json
          node scripts/extract-rollout.mjs targeted index.json targeted-request.json
      - name: Dispatch only the reviewed two-region acquisition
        if: steps.targeted.outputs.required == 'true' && github.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REGION_IDS: ${{ steps.targeted.outputs.region_ids }}
          SOURCE_DATE: ${{ steps.targeted.outputs.source_date }}
        run: |
          set -euo pipefail
          [[ "$REGION_IDS" == "south-america,australia-oceania" ]]
          [[ "$SOURCE_DATE" == "2026-11-24" ]]
          gh workflow run osm-extract.yml --ref main \
            -f "region_ids=$REGION_IDS" -f "source_date=$SOURCE_DATE" -f gaps_only=false
      - name: Check required continuation
        if: steps.targeted.outputs.matched != 'true'
        id: readiness
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXTRACT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            node scripts/extract-rollout.mjs refresh index.json
          else
            node scripts/extract-rollout.mjs assemble index.json
          fi
      - name: Continue through the existing bounded workflow
        if: steps.readiness.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then workflow=osm-extract.yml; else workflow=osm-assemble.yml; fi
          # Queue through existing non-cancelling concurrency. An active refresh
          # may be gaps-only; an active assembly may hold an older input index.
          gh workflow run "$workflow" --ref main
