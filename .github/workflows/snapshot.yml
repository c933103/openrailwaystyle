name: Build worldwide railway lifecycle snapshot
on:
  push:
    branches: [main, build/world-lifecycle]
    paths:
      - scripts/build-snapshot.mjs
      - scripts/lifecycle.mjs
      - scripts/snapshot-delta.mjs
      - scripts/refresh-snapshot-cache.mjs
      - scripts/build-loading-gauge-list.mjs
      - styles/loading-gauge-list.mjs
      - scripts/build-polar.mjs
      - scripts/polar-contours.mjs
      - scripts/polar-features.mjs
      - styles/polar.mjs
      - scripts/pack-snapshot.py
  workflow_dispatch:
    inputs:
      refresh:
        description: Re-download the oldest part of the world from Overpass
        type: boolean
        default: false
  # Monday, Wednesday and Friday at 03:23 UTC, night across Europe, where
  # most users of the public Overpass server (overpass-api.de, in Germany)
  # are. Each run fetches the ways changed since the previous run (typically
  # under 1 MB), the loading gauge list (about 4 MB) and renews about 5 MB of
  # the oldest full region responses, which catches what change queries miss
  # (e.g. deleted ways). That keeps each run day near the Overpass API wiki's
  # guidance for regular applications (under 100 queries and 10 MB a day).
  schedule:
    - cron: '23 3 * * 1,3,5'
permissions:
  contents: write
  actions: write
concurrency:
  group: lifecycle-snapshot
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Allow prior cancelled query and cache save to finish
        run: sleep 100
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: pip install pmtiles==3.8.1
      - uses: actions/cache/restore@v4
        with:
          path: .snapshot-cache
          key: lifecycle-initial-20260922
          restore-keys: lifecycle-initial-20260922-
      # The raw Overpass responses are also kept in a release, which unlike
      # the Actions cache never expires and is reachable from any branch.
      - name: Restore raw Overpass responses from the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The Actions cache may be partial (saved by a failed run) or older, so
        # merge the release in, keeping the newer copy of each file.
        run: |
          mkdir -p .snapshot-cache /tmp/release-cache
          if gh release download overpass-cache --pattern 'overpass-cache.tar.zst' --dir /tmp; then
            tar --zstd -xf /tmp/overpass-cache.tar.zst -C /tmp/release-cache
            cp -a -u /tmp/release-cache/.snapshot-cache/. .snapshot-cache/
            echo "Merged $(ls /tmp/release-cache/.snapshot-cache | wc -l) files from the release; $(ls .snapshot-cache | wc -l) cached files now"
          else
            echo "No stored Overpass responses in the release"
          fi
      - name: Choose regions to refresh
        if: github.event_name == 'schedule' || inputs.refresh
        env:
          REFRESH_BYTES: '5000000'
        run: node scripts/refresh-snapshot-cache.mjs
      # If Overpass is busy, the snapshot is built with the changes recorded
      # so far and the next run catches up from the same point.
      - name: Fetch ways changed since the previous run
        continue-on-error: true
        env:
          SNAPSHOT_REGION: delta
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      # Loading gauge by way ID, for the zoom 0–6 overview. If Overpass is
      # busy the previous list is published again.
      - name: Fetch loading gauge list
        continue-on-error: true
        run: node scripts/build-loading-gauge-list.mjs
      # The two caps beyond 85.05° that Web Mercator tiles miss: contours and
      # relief from ETOPO 2022 (fetched once, then cached) and OpenStreetMap
      # base features and Carto detail (four longitude sectors per cap,
      # renewed every 4 weeks). Failed/partial queries cannot replace a
      # complete published pair of caps.
      - name: Restore the previous complete polar assets
        run: |
          status=0
          git ls-remote --exit-code --heads origin rail-data || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin rail-data
            mkdir -p snapshot
            if git cat-file -e FETCH_HEAD:polar; then
              git archive FETCH_HEAD polar | tar -x -C snapshot
            fi
          elif [ "$status" != 2 ]; then
            exit "$status"
          fi
      - name: Prepare the polar caps
        continue-on-error: true
        run: node scripts/build-polar.mjs
      - name: Collect world region 1 of 20
        env:
          SNAPSHOT_REGION: '0'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 2 of 20
        env:
          SNAPSHOT_REGION: '1'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 3 of 20
        env:
          SNAPSHOT_REGION: '2'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 4 of 20
        env:
          SNAPSHOT_REGION: '3'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 5 of 20
        env:
          SNAPSHOT_REGION: '4'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 6 of 20
        env:
          SNAPSHOT_REGION: '5'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 7 of 20
        env:
          SNAPSHOT_REGION: '6'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 8 of 20
        env:
          SNAPSHOT_REGION: '7'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 9 of 20
        env:
          SNAPSHOT_REGION: '8'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 10 of 20
        env:
          SNAPSHOT_REGION: '9'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 11 of 20
        env:
          SNAPSHOT_REGION: '10'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 12 of 20
        env:
          SNAPSHOT_REGION: '11'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 13 of 20
        env:
          SNAPSHOT_REGION: '12'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 14 of 20
        env:
          SNAPSHOT_REGION: '13'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 15 of 20
        env:
          SNAPSHOT_REGION: '14'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 16 of 20
        env:
          SNAPSHOT_REGION: '15'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 17 of 20
        env:
          SNAPSHOT_REGION: '16'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 18 of 20
        env:
          SNAPSHOT_REGION: '17'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 19 of 20
        env:
          SNAPSHOT_REGION: '18'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Collect world region 20 of 20
        env:
          SNAPSHOT_REGION: '19'
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - name: Assemble complete worldwide archive
        env:
          SNAPSHOT_REGION: assemble
        run: node --max-old-space-size=6144 scripts/build-snapshot.mjs
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .snapshot-cache
          key: lifecycle-initial-20260922-${{ github.run_id }}
      - name: Store raw Overpass responses in the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar --zstd --exclude='budget-*' -cf /tmp/overpass-cache.tar.zst .snapshot-cache
          ls -l /tmp/overpass-cache.tar.zst
          gh release view overpass-cache >/dev/null 2>&1 || gh release create overpass-cache --target "$GITHUB_SHA" --prerelease --title 'Raw Overpass responses for the lifecycle snapshot' --notes 'Cached Overpass API responses (© OpenStreetMap contributors, ODbL) used to rebuild the railway lifecycle snapshot without querying Overpass again. Replaced by each snapshot build.'
          gh release upload overpass-cache /tmp/overpass-cache.tar.zst --clobber
      - run: python scripts/pack-snapshot.py
      - name: Publish validated snapshot branch
        run: |
          cp snapshot/manifest.json /tmp/rail-manifest.json
          cp snapshot/lifecycle.pmtiles /tmp/rail-lifecycle.pmtiles
          cp snapshot/lifecycle.geojson.gz /tmp/rail-lifecycle.geojson.gz
          cp snapshot/loading-gauge.json /tmp/rail-loading-gauge.json 2>/dev/null || true
          rm -rf /tmp/rail-polar
          if [ -f snapshot/polar/north-index.json ] && [ -f snapshot/polar/south-index.json ]; then cp -r snapshot/polar /tmp/rail-polar; fi
          # One commit replaces the previous snapshot, so the repository keeps
          # only the current data instead of every past copy.
          git checkout --orphan rail-data
          git rm -rf .
          git clean -fdx
          cp /tmp/rail-manifest.json manifest.json
          cp /tmp/rail-loading-gauge.json loading-gauge.json 2>/dev/null || true
          if [ -d /tmp/rail-polar ]; then cp -r /tmp/rail-polar polar; fi
          # Keep individual Git blobs below the hosting limit. Pages receives
          # the reassembled archive; viewers still request just its needed bytes.
          split -b 80M -d -a 3 /tmp/rail-lifecycle.pmtiles lifecycle.pmtiles.part-
          split -b 80M -d -a 3 /tmp/rail-lifecycle.geojson.gz lifecycle.geojson.gz.part-
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json lifecycle.pmtiles.part-* lifecycle.geojson.gz.part-*
          if [ -f loading-gauge.json ]; then git add loading-gauge.json; fi
          if [ -d polar ]; then git add polar; fi
          git commit -m "Publish complete worldwide railway lifecycle snapshot"
          git push --force origin HEAD:refs/heads/rail-data
      - name: Redeploy the site with the new snapshot
        if: github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build/world-lifecycle'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main
