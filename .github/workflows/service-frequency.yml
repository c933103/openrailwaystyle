name: Build worldwide service frequencies
on:
  push:
    branches: [main]
    paths:
      - scripts/global-service-frequency.py
      - scripts/frequency_catalogue.py
      - scripts/frequency_references.py
      - scripts/frequency-reference-schema.json
      - scripts/frequency-reference-metadata.mjs
      - scripts/frequency_retry.py
      - scripts/gtfs-frequency.py
      - scripts/gtfs-shapes.py
      - scripts/gtfs-rail-paths.py
      - scripts/assemble-global-frequency.mjs
      - scripts/read-frequency-feed.mjs
      - scripts/gtfs-service.mjs
      - scripts/service-routes.mjs
      - styles/pbf-utf8.mjs
      - styles/service-frequency.mjs
      - styles/data-src/frequency-source-rules.json
      - .github/workflows/service-frequency.yml
  workflow_dispatch:
    inputs:
      service_date:
        description: 'Reference date (YYYY-MM-DD); blank uses next Monday'
        required: false
  schedule:
    - cron: '41 2 * * 1'
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - 'tests/*frequency*'
      - docs/service-frequency.md
      - tests/gtfs-service.test.mjs
      - tests/service-routes.test.mjs
      - tests/pbf-utf8.test.mjs
      - 'tests/fixtures/service-frequency/**'
      - scripts/rebuild-service-frequency.mjs
      - scripts/frequency-credits.mjs
      - scripts/load-frequency-snapshot.py
      - scripts/global-service-frequency.py
      - scripts/frequency_catalogue.py
      - scripts/frequency_references.py
      - scripts/frequency-reference-schema.json
      - scripts/frequency-reference-metadata.mjs
      - scripts/frequency_retry.py
      - scripts/gtfs-frequency.py
      - scripts/gtfs-shapes.py
      - scripts/gtfs-rail-paths.py
      - scripts/assemble-global-frequency.mjs
      - scripts/read-frequency-feed.mjs
      - scripts/gtfs-service.mjs
      - scripts/service-routes.mjs
      - styles/pbf-utf8.mjs
      - styles/service-frequency.mjs
      - styles/data-src/frequency-source-rules.json
      - .github/workflows/service-frequency.yml
permissions:
  contents: read
concurrency:
  group: worldwide-frequency-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('push-{0}', github.ref) || github.ref }}
  # Offline pushes/PRs cannot replace or cancel a queued production refresh.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
jobs:
  # Retain the existing check name; relevant main pushes validate offline too.
  validate-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate code with frequency fixtures and loopback-only networking
        run: |
          # Only this child process loses external networking. Loopback serves
          # the real range/conditional-download fixtures; no provider is queried.
          # Drop root and disable privilege gains in this fixture process.
          sudo unshare --net -- bash -euc '
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --init-groups --no-new-privs \
              "$3" --test \
              tests/global-frequency.test.mjs \
              tests/gtfs-frequency.test.mjs \
              tests/gtfs-service.test.mjs \
              tests/read-frequency-feed.test.mjs \
              tests/pbf-utf8.test.mjs \
              tests/service-frequency.test.mjs \
              tests/service-routes.test.mjs \
              tests/frequency-credits.test.mjs \
              tests/service-frequency-workflow.test.mjs
          ' _ "$(id -u)" "$(id -g)" "$(command -v node)"
  catalogue:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      service_date: ${{ steps.date.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: date
        env:
          REQUESTED_DATE: ${{ inputs.service_date }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, os
          today=dt.datetime.now(dt.timezone.utc).date()
          reference=os.environ.get('REQUESTED_DATE') or (today+dt.timedelta(days=(-today.weekday())%7)).isoformat()
          dt.date.fromisoformat(reference)
          print('value='+reference)
          PY
      - name: Run offline source-eligibility and catalogue regression fixtures
        run: |
          python3 -m unittest discover -s tests -p 'frequency_catalogue_test.py'
          python3 -m unittest discover -s tests -p 'global_frequency_test.py'
      - name: Pin actual Transitous feed registry and authoritative Mobility Database export
        run: |
          mkdir -p catalogue
          timeout --signal=TERM --kill-after=30s 600 git clone --quiet --depth=1 --filter=blob:none --sparse https://github.com/public-transport/transitous.git catalogue/transitous
          timeout --signal=TERM --kill-after=30s 600 git -C catalogue/transitous sparse-checkout set feeds website/data
          transitous_ref="$(git -C catalogue/transitous rev-parse HEAD)"
          # Resolve against the immutable gitlink, never submodule --remote or
          # an upstream fetch program. A failed metadata checkout is retained as
          # explicit unresolved evidence by the normalizer, not an empty index.
          transitland_ref="$(git -C catalogue/transitous ls-tree "$transitous_ref" transitland-atlas | awk '$1 == "160000" && $2 == "commit" {print $3}')"
          [[ "$transitland_ref" =~ ^[a-f0-9]{40}$ ]]
          if git init --quiet catalogue/transitland &&
             git -C catalogue/transitland remote add origin https://github.com/transitland/transitland-atlas.git &&
             timeout --signal=TERM --kill-after=30s 600 git -C catalogue/transitland fetch --quiet --depth=1 --filter=blob:none origin "$transitland_ref" &&
             timeout --signal=TERM --kill-after=30s 600 git -C catalogue/transitland sparse-checkout set feeds &&
             timeout --signal=TERM --kill-after=30s 600 git -C catalogue/transitland checkout --quiet --detach "$transitland_ref" &&
             test "$(git -C catalogue/transitland rev-parse HEAD)" = "$transitland_ref"; then
            transitland_feeds=catalogue/transitland/feeds
          else
            echo 'Pinned Transitland metadata unavailable; references remain explicit and unresolved.'
            transitland_feeds=catalogue/unavailable-transitland-feeds
          fi
          curl --fail --retry 3 --retry-all-errors --retry-max-time 900 --location --max-time 300 \
            https://files.mobilitydatabase.org/feeds_v2.csv --output catalogue/mobility.csv
          python3 scripts/frequency_catalogue.py \
            --licences catalogue/transitous/website/data/license.json \
            --feeds-directory catalogue/transitous/feeds \
            --transitous-ref "$transitous_ref" \
            --mobility-csv catalogue/mobility.csv \
            --transitland-feeds-directory "$transitland_feeds" --transitland-ref "$transitland_ref" \
            --output catalogue/catalogue.json --report catalogue/catalogue-report.json
      - name: Inventory eligibility without downloading public GTFS archives
        run: |
          python3 scripts/global-service-frequency.py --catalogue catalogue/catalogue.json --catalogue-report catalogue/catalogue-report.json --cache /tmp/frequency-cache --output catalogue --date '${{ steps.date.outputs.value }}' --inventory-only
          python3 - <<'PY'
          import collections,json
          inventory=json.load(open('catalogue/inventory-0.json'))
          print(json.dumps({'entries':inventory['catalogue_entries'],
            'statuses':inventory['counts'],
            'reasons':dict(collections.Counter((e['reason_code'] or 'none') for e in inventory['entries']))}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: worldwide-frequency-catalogue
          path: |
            catalogue/catalogue.json
            catalogue/catalogue-report.json
            catalogue/inventory-0.json
          retention-days: 14
  compile:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: catalogue
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: worldwide-frequency-catalogue
          path: catalogue
      - name: Load existing published branch and metro geometry
        run: |
          mkdir -p railway-graph
          if git ls-remote --exit-code --heads origin branch-data; then
            git fetch --depth=1 origin branch-data
            git show FETCH_HEAD:branch-lines.ndjson.gz > railway-graph/branch-lines.ndjson.gz
          fi
      - uses: actions/cache@v4
        with:
          path: |
            frequency-cache
            frequency-output/feeds
          key: worldwide-gtfs-${{ matrix.shard }}-${{ needs.catalogue.outputs.service_date }}-${{ github.run_id }}
          restore-keys: worldwide-gtfs-${{ matrix.shard }}-
      - name: Compile every eligible feed in this worldwide shard
        run: |
          graph=()
          if [ -f railway-graph/branch-lines.ndjson.gz ]; then graph=(--rail-graph railway-graph/branch-lines.ndjson.gz); fi
          python3 scripts/global-service-frequency.py --catalogue catalogue/catalogue.json --catalogue-report catalogue/catalogue-report.json --cache frequency-cache --output frequency-output --date '${{ needs.catalogue.outputs.service_date }}' --shards 8 --shard '${{ matrix.shard }}' "${graph[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldwide-frequency-shard-${{ matrix.shard }}
          path: frequency-output/
          retention-days: 14
  assemble:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [catalogue, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: worldwide-frequency-shard-*
          path: frequency-output
          merge-multiple: true
      - name: Validate complete inventory and assemble bounded tile batches
        run: node --max-old-space-size=5500 scripts/assemble-global-frequency.mjs frequency-output
      - uses: actions/upload-artifact@v4
        with:
          name: worldwide-frequency-snapshot
          path: frequency-output/
          retention-days: 14
  publish:
    needs: assemble
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: worldwide-frequency-snapshot
          path: frequency-output
      - name: Publish the complete data snapshot independently of application code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Per-feed derived archives are intermediate matching caches, not
          # redistributable website assets. Publish only aggregate outputs.
          tar -czf frequency-snapshot.tar.gz -C frequency-output manifest.json inventory.json tiles
          # One data release, with the current snapshot. No force pushes or
          # changes to other workers' snapshot branches or application PRs.
          status=0
          gh api "repos/$GH_REPO/releases/tags/service-frequency-data" > /tmp/frequency-release.json 2>/tmp/frequency-release-error || status=$?
          if [ "$status" != 0 ]; then
            if ! grep -q '404' /tmp/frequency-release-error; then cat /tmp/frequency-release-error; exit "$status"; fi
            gh release create service-frequency-data --title 'Worldwide service-frequency data' --notes 'Aggregate worldwide timetable coverage metadata and inventory; per-feed derived archives are not redistributed.'
          fi
          gh release upload service-frequency-data frequency-snapshot.tar.gz frequency-output/manifest.json frequency-output/inventory.json --clobber
          gh workflow run site.yml --ref main
