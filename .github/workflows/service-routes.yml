name: Build urban rail services
on:
  workflow_dispatch:
  # Every six hours, between the branch-line runs (which use the same public
  # Overpass server): one region stage per run (Japan first), each capped at
  # 50 MB of downloads and 100 MB a day (the branch lines take up to 900 MB),
  # so both together stay within the server's guidance of about 1 GB a day.
  # Once every region is in, a run refreshes the region checked longest ago
  # when it is two weeks old, and otherwise ends without downloading anything.
  schedule:
    - cron: '11 3-23/6 * * *'
  push:
    branches: [main]
    paths: ['scripts/build-service-routes.mjs', 'scripts/service-routes.mjs', '.github/workflows/service-routes.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: service-data
  cancel-in-progress: false
jobs:
  stage:
    # Only main publishes the shared snapshot (branches and manual runs
    # started from other refs never replace it).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Load the previous table
        run: |
          # Exit status 2 means no such branch (the first run); any other
          # failure stops the run, so an unreachable remote never leads to a
          # fresh table published over the worldwide one.
          status=0
          git ls-remote --exit-code --heads origin service-data || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin service-data
            mkdir -p /tmp/previous-service
            git --work-tree=/tmp/previous-service checkout FETCH_HEAD -- service-routes.ndjson.gz state.json
          elif [ "$status" != 2 ]; then
            echo "Could not look up the service-data snapshot (git exit $status)"
            exit 1
          fi
      - name: Fetch the next region from OpenStreetMap
        id: build
        run: |
          if [ -f /tmp/previous-service/state.json ]; then export PREVIOUS_DATA=/tmp/previous-service; fi
          node scripts/build-service-routes.mjs
      - name: Publish the table and tiles
        if: steps.build.outputs.publish == 'true'
        run: |
          mkdir /tmp/service-publish
          cd /tmp/service-publish
          git init
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # One commit, replaced each time: its history is not needed.
          git checkout --orphan service-data
          cp -r "$GITHUB_WORKSPACE/service-data/." .
          git add .
          git commit -q -m "Urban rail services $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git push --force origin HEAD:service-data; then
            test "$(git ls-remote origin refs/heads/service-data | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      - name: Redeploy the site with the new services
        if: steps.build.outputs.redeploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main
