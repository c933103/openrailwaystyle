name: Build worldwide railway signals and energy supplies
on:
  # Started every six hours, and when its builder changes, by
  # osm-updates.yml (one Overpass dataset at a time).
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: traction-facilities-snapshot
  cancel-in-progress: true
jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache/restore@v4
        with:
          path: .snapshot-cache
          key: traction-facilities-v1-${{ github.run_id }}
          restore-keys: traction-facilities-v1-
      - name: Restore durable raw facility responses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .snapshot-cache /tmp/traction-cache
          if gh release download traction-facilities-cache --pattern traction-facilities-cache.tar.zst --dir /tmp; then
            tar --zstd -xf /tmp/traction-facilities-cache.tar.zst -C /tmp/traction-cache
            cp -a -u /tmp/traction-cache/.snapshot-cache/. .snapshot-cache/
          fi
      # Allow reachable endpoints longer than Node's 250 ms per-address default.
      - name: Collect railway energy supplies worldwide
        run: node --network-family-autoselection-attempt-timeout=2000 scripts/build-power-facilities.mjs
      - name: Collect conductor rails and battery train charging worldwide
        run: node --network-family-autoselection-attempt-timeout=2000 scripts/build-power-methods.mjs
      # One download per region for both signal snapshots: signals without a
      # direction, and electrification signals for the Power view.
      - name: Collect signals missing provider direction data, and electrification signals, worldwide
        run: node --network-family-autoselection-attempt-timeout=2000 --max-old-space-size=6144 scripts/build-signals.mjs
      - name: Preserve completed region responses
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .snapshot-cache
          key: traction-facilities-v1-${{ github.run_id }}
      - name: Preserve durable raw responses for resumable builds
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d .snapshot-cache ]; then
            tar --zstd -cf /tmp/traction-facilities-cache.tar.zst .snapshot-cache
            gh release view traction-facilities-cache >/dev/null 2>&1 || gh release create traction-facilities-cache --target "$GITHUB_SHA" --prerelease --title 'Raw railway facility responses' --notes 'Cached OpenStreetMap Overpass responses, ODbL, for rebuilding worldwide railway signal and energy supply snapshots without repeating completed queries.'
            gh release upload traction-facilities-cache /tmp/traction-facilities-cache.tar.zst --clobber
          fi
      - name: Validate complete snapshots
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {validatePowerMethodsSnapshot} from './scripts/build-power-methods.mjs';
          const power=JSON.parse(await readFile('power-data/manifest.json'));
          const features=JSON.parse(await readFile('power-data/power-facilities.geojson'));
          const methods=JSON.parse(await readFile('power-data/methods-manifest.json'));
          const methodData=JSON.parse(await readFile('power-data/power-methods.geojson'));
          validatePowerMethodsSnapshot(methodData,methods);
          const {validateElectricitySignalsSnapshot}=await import('./scripts/build-electricity-signals.mjs');
          validateElectricitySignalsSnapshot(JSON.parse(await readFile('power-data/electricity-signals.geojson')),JSON.parse(await readFile('power-data/electricity-signals-manifest.json')));
          assert.equal(power.complete,true);
          assert.equal(features.features.length,power.features);
          assert.ok(power.coverage.length>=8 && power.features>0);
          const signal=JSON.parse(await readFile('signal-data/manifest.json'));
          assert.equal(signal.complete,true);
          const index=JSON.parse(await readFile('signal-data/index.json'));
          assert.ok(index.tiles.length>0);
          console.log('Validated worldwide facilities:',power.features,'energy supply facilities; signals',signal);
          JS
      - name: Publish validated static facility data
        id: publish
        run: |
          mkdir -p /tmp/traction-publish
          cp -r power-data /tmp/traction-publish/power
          cp -r signal-data /tmp/traction-publish/signals
          git checkout --orphan traction-data
          git rm -rf .
          git clean -fdx
          cp -r /tmp/traction-publish/power /tmp/traction-publish/signals .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add power signals
          # Every six hours a run mostly reproduces the published data from
          # its cached responses. Publish and redeploy only when something
          # other than the manifests' build times changed.
          status=0
          git ls-remote --exit-code --heads origin traction-data > /dev/null || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin traction-data
            mkdir -p /tmp/traction-previous
            git archive FETCH_HEAD | tar -x -C /tmp/traction-previous
            if diff -rq -x '*manifest.json' /tmp/traction-previous/power power && diff -rq -x '*manifest.json' /tmp/traction-previous/signals signals; then
              echo "Published data unchanged; nothing to publish"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ "$status" != 2 ]; then
            exit "$status"
          fi
          git commit -m 'Publish complete worldwide railway energy supplies and supplementary signals'
          git push --force origin HEAD:refs/heads/traction-data
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy the site with the new facilities
        if: github.ref == 'refs/heads/main' && steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main
