name: Resume site checks after railway reference completion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mainline-reference-completed.yml']
  workflow_run:
    workflows: ['Build worldwide OSM railway reference', 'Validate and deploy world railway map']
    types: [completed]
permissions:
  actions: write
  pull-requests: read
concurrency:
  group: mainline-site-retry-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  retry:
    if: (github.event.workflow_run.name == 'Build worldwide OSM railway reference' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch')) || (github.event.workflow_run.name == 'Validate and deploy world railway map' && github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run uses this trusted default-branch definition. Never check
      # out a fork, download artifacts, or execute source-run code here.
      - name: Retry failed site checks for the exact current open PR head
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$TRIGGER_RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          verified=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN" --jq 'select(.name == env.TRIGGER_NAME and ((.name == "Build worldwide OSM railway reference" and .conclusion == "success" and (.event == "pull_request" or .event == "workflow_dispatch")) or (.name == "Validate and deploy world railway map" and .event == "pull_request" and (.conclusion == "failure" or .conclusion == "timed_out")))) | .head_sha')
          [ "$verified" = "$SOURCE_SHA" ]
          # Fork payloads may omit pull_requests. A same-SHA PR is not enough:
          # use explicit PR associations, or the exact head repository/ref pair.
          matches_pr() {
            jq -en --argjson run "$1" --argjson pr "$2" --argjson history "$history" '
              $pr.state == "open" and $pr.head.sha == env.SOURCE_SHA and
              $run.head_sha == $pr.head.sha and
              (if ($run.pull_requests // [] | length) > 0 then
                any($run.pull_requests[]; .number == $pr.number)
              else
                $run.head_repository.id != null and $run.head_branch != null and
                $run.head_repository.id == $pr.head.repo.id and $run.head_branch == $pr.head.ref and
                ([$history[] | select((.head.repo.id // $run.head_repository.id) == $run.head_repository.id and (.head.ref // $run.head_branch) == $run.head_branch)] |
                  length == 1 and .[0].number == $pr.number)
              end)' >/dev/null
          }
          prs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[] | select(.head.sha == env.SOURCE_SHA) | .number')
          [ -n "$prs" ] || exit 0
          # A closed PR and its replacement can reuse the same repository,
          # branch and commit. Missing run associations are usable only when
          # the tuple identifies one PR across the full open/closed history.
          # Do not filter historical heads by SHA: they may have moved since
          # the run. Missing historical identity fields are ambiguous too.
          # Pagination must complete successfully before checking uniqueness.
          history=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100" --jq '.[] | {number, head: {ref: .head.ref, repo: {id: .head.repo.id}}}' | jq -s .)
          if [ "$TRIGGER_NAME" = 'Build worldwide OSM railway reference' ]; then
            builds=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN" --jq '@base64')
          else
            builds=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mainline-reference.yml/runs?head_sha=$SOURCE_SHA&per_page=100" --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "success" and (.event == "pull_request" or .event == "workflow_dispatch")) | @base64')
          fi
          [ -n "$builds" ] || exit 0
          # If source completion races the last polling sleep, the later site
          # completion event retries. Preserve application/test failures and
          # allow at most one automatic retry of each site run.
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/site.yml/runs?event=pull_request&head_sha=$SOURCE_SHA&per_page=100" --jq '.workflow_runs[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out") and (.run_attempt // 1) < 2) | .id')
          for run in $runs; do
            # Recheck the current attempt in case a maintainer already retried it.
            metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq 'select(.event == "pull_request" and .status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out") and (.run_attempt // 1) < 2)')
            [ -n "$metadata" ] || continue
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100")
            missing=$(printf '%s' "$jobs" | jq -r '.jobs[] | select(.name == "reference" and (.conclusion == "failure" or .conclusion == "timed_out")) | .id')
            [ -n "$missing" ] || continue
            # A head SHA can have multiple tested bases. The failed site's
            # own job metadata binds its required digest; stale source inputs
            # must not consume the site's one permitted automatic retry.
            expected=$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.name == "reference" and (.conclusion == "failure" or .conclusion == "timed_out")) | .steps[]? | .name | capture("^Require worldwide railway reference (?<digest>[0-9a-f]{64})$").digest] | unique | if length == 1 then .[0] else empty end')
            [ -n "$expected" ] || continue
            for pr in $prs; do
              current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")
              matches_pr "$metadata" "$current" || continue
              ready=false
              for encoded in $builds; do
                build=$(printf '%s' "$encoded" | base64 --decode)
                matches_pr "$build" "$current" || continue
                artifacts=$(REFERENCE_DIGEST="$expected" gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$(printf '%s' "$build" | jq -r .id)/artifacts?per_page=100" --jq '.artifacts[] | select((.name | test("^mainline-reference-[0-9]{4}-[0-9]{2}-[0-9]{2}-" + env.REFERENCE_DIGEST + "$")) and .expired == false and .size_in_bytes > 0 and .size_in_bytes < 1073741824) | .id')
                [ -n "$artifacts" ] || continue
                ready=true; break
              done
              [ "$ready" = true ] || continue
              gh run rerun "$run" --failed --repo "$GITHUB_REPOSITORY"
              break
            done
          done
  release-obsolete-waits:
    if: github.event_name == 'push' || (github.event.workflow_run.name == 'Build worldwide OSM railway reference' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      # Trusted default-branch metadata only. Keep any validation or deployment
      # untouched; release only a superseded main revision's reference wait.
      - name: Release obsolete pre-validation reference waits
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id || '' }}
          RECOVERY_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PYTHON'
          import json, os, re, subprocess

          repository = os.environ['GITHUB_REPOSITORY']
          repository_id = int(os.environ['GITHUB_REPOSITORY_ID'])
          trigger = os.environ['TRIGGER_RUN']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
              raise ValueError('Invalid trusted workflow context')
          prefix = f'repos/{repository}'


          def read(path, pages=False):
              args = ['gh', 'api', f'{prefix}/{path}']
              if pages:
                  args += ['--paginate', '--slurp']
              return json.loads(subprocess.run(args, capture_output=True, text=True,
                                               check=True, timeout=45).stdout)


          def own_main(run, name, path):
              return (run.get('name') == name and run.get('path') == path and
                      run.get('repository', {}).get('id') == repository_id and
                      run.get('head_repository', {}).get('id') == repository_id and
                      run.get('head_branch') == 'main' and run.get('event') in ('push', 'workflow_dispatch') and
                      re.fullmatch(r'[0-9a-f]{40}', run.get('head_sha', '')) is not None)


          if not trigger:
              if os.environ['RECOVERY_EVENT'] != 'push' or os.environ['GITHUB_REF'] != 'refs/heads/main':
                  raise ValueError('Recovery without a source run requires a trusted main push')
              builds = read('actions/workflows/mainline-reference.yml/runs?branch=main&status=success&per_page=100', True)
              sources = [run for page in builds for run in page['workflow_runs']
                         if own_main(run, 'Build worldwide OSM railway reference', '.github/workflows/mainline-reference.yml') and
                         run.get('status') == 'completed' and run.get('conclusion') == 'success']
              if not sources:
                  print('No successful trusted main reference exists; leave production waits untouched.')
                  raise SystemExit(0)
              trigger = str(sources[0]['id'])
          if not trigger.isdigit():
              raise ValueError('Invalid reference run ID')
          source = read(f'actions/runs/{trigger}')
          if not (own_main(source, 'Build worldwide OSM railway reference', '.github/workflows/mainline-reference.yml') and
                  source.get('status') == 'completed' and source.get('conclusion') == 'success'):
              print('No obsolete production wait recovery for this source event.')
              raise SystemExit(0)


          def current_head():
              sha = read('git/ref/heads/main').get('object', {}).get('sha', '')
              if not re.fullmatch(r'[0-9a-f]{40}', sha):
                  raise ValueError('Invalid current main reference')
              return sha


          def waiting(run):
              if not (own_main(run, 'Validate and deploy world railway map', '.github/workflows/site.yml') and
                      run.get('status') == 'in_progress' and run.get('conclusion') is None and
                      isinstance(run.get('id'), int) and run['id'] > 0):
                  return False
              jobs = [job for page in read(f"actions/runs/{run['id']}/jobs?filter=latest&per_page=100", True)
                      for job in page['jobs']]
              # Never cancel a validation/browser/deployment run, even if that job is
              # only queued. A waiting reference plus completed startup jobs is read-only.
              if (not jobs or len({job['name'] for job in jobs}) != len(jobs) or
                      any(job['name'] not in ('reference', 'facilities', 'plan') for job in jobs)):
                  return False
              reference = [job for job in jobs if job['name'] == 'reference']
              if len(reference) != 1:
                  return False
              if any(job.get('status') != 'completed' or job.get('conclusion') != 'success'
                     for job in jobs if job['name'] != 'reference'):
                  return False
              ref = reference[0]
              active = [step for step in ref.get('steps', []) if step.get('status') == 'in_progress']
              return (ref.get('status') == 'in_progress' and ref.get('conclusion') is None and len(active) == 1 and
                      re.fullmatch(r'Require worldwide railway reference [0-9a-f]{64}', active[0].get('name', '')) is not None)


          def has_replacement(sha):
              pages = read(f'actions/workflows/site.yml/runs?branch=main&head_sha={sha}&per_page=100', True)
              return any(own_main(run, 'Validate and deploy world railway map', '.github/workflows/site.yml') and
                         run.get('head_sha') == sha and
                         (run.get('status') in ('queued', 'pending', 'waiting', 'in_progress') or
                          run.get('status') == 'completed' and run.get('conclusion') == 'success')
                         for page in pages for run in page['workflow_runs'])


          pages = read('actions/workflows/site.yml/runs?branch=main&status=in_progress&per_page=100', True)
          candidates = {run['id'] for page in pages for run in page['workflow_runs']
                        if isinstance(run.get('id'), int) and run['id'] > 0}
          for run_id in sorted(candidates):
              run = read(f'actions/runs/{run_id}')
              if run.get('head_sha') == current_head() or not waiting(run):
                  continue
              # Recheck both the branch and complete job list immediately before the
              # mutation. A run that has advanced to validation is left untouched.
              latest = read(f'actions/runs/{run_id}')
              current = current_head()
              if latest.get('head_sha') != run.get('head_sha') or latest.get('head_sha') == current or not has_replacement(current) or not waiting(latest):
                  continue
              subprocess.run(['gh', 'api', '--method', 'POST', f'{prefix}/actions/runs/{run_id}/cancel'],
                             capture_output=True, text=True, check=True, timeout=30)
              print(f"Requested cancellation of obsolete reference-only wait {run_id} at {latest['head_sha']}; current main is {current}.")
          PYTHON
