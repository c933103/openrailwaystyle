name: Validate PR 73 refresh and name-tag fixes
on:
  push:
    branches: [fix/pr73-refresh-and-name-tags]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce failures before changing production code
        shell: bash
        run: |
          set -euo pipefail
          if node --experimental-vm-modules --test tests/curated-name-refresh.test.mjs > /tmp/pr73-before.log 2>&1; then
            cat /tmp/pr73-before.log
            echo 'Expected the new regressions to expose the old bugs.'
            exit 1
          fi
          grep -A14 -B2 'not ok' /tmp/pr73-before.log
          grep -q 'not ok.*refresh completed while hidden' /tmp/pr73-before.log
          grep -q 'not ok.*OSM annotations cannot enter' /tmp/pr73-before.log
      - name: Apply only the two source fixes and synchronize assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('styles/app.mjs');text=p.read_text()
          def change(old,new):
              global text
              if text.count(old)!=1:raise SystemExit('Expected one patch anchor: '+old)
              text=text.replace(old,new,1)
          change('const stationNameTags=tags=>{', "// Match language-name syntax used by tileStations, plus two supported legacy aliases.\nconst isStationNameTag=key=>/^name(:[a-z]{2,3}([-_][A-Za-z0-9]+)*)?$/.test(key)||key==='name:ko:hanja'||key==='name:vi:nom';\nconst stationNameTags=tags=>{")
          change("Object.entries(tags).filter(([key])=>key==='name'||key.startsWith('name:'))",'Object.entries(tags).filter(([key])=>isStationNameTag(key))')
          change("Object.entries(record.tags).filter(([tag,value])=>(tag==='name'||tag.startsWith('name:'))&&typeof value==='string')","Object.entries(record.tags).filter(([tag,value])=>isStationNameTag(tag)&&typeof value==='string')")
          change(' const requestId=++majorStationRequestId;', ' // A cache refresh may finish while hidden. Until applied, the rendered\n // source must not be marked current merely because the cache is fresh.\n majorStationLanguages.delete(source);\n const requestId=++majorStationRequestId;')
          p.write_text(text)
          changed=[]
          for folder in ['styles','scripts']:
              for p in Path(folder).rglob('*'):
                  if not p.is_file() or p.suffix not in ['.mjs','.js','.html'] or 'vendor' in p.parts:continue
                  original=p.read_text();updated=original.replace('20261003-112900','20261003-115500')
                  if updated!=original:p.write_text(updated);changed.append(str(p))
          assert len(changed)>=4,changed
          print('VERSIONED_FILES',changed)
          PY
      - name: Run all tests and keep generated rendering unchanged
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          git diff --exit-code -- styles/world.style.json styles/major-stations.geojson
          node --experimental-vm-modules --test tests/curated-name-refresh.test.mjs
          npm test > /tmp/pr73-after.log 2>&1 || { grep -A35 -B3 'not ok' /tmp/pr73-after.log; tail -12 /tmp/pr73-after.log; exit 1; }
          tail -12 /tmp/pr73-after.log
          node --check styles/app.mjs
          git diff --check
      - name: Publish tested tree on the isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/pr73-refresh-and-name-tags
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr73-refresh-validation.yml
          git add -u
          git diff --cached --stat
          git commit -m 'Reapply hidden station-name refreshes and exclude semantic name annotations'
          git push origin HEAD:refs/heads/fix/pr73-refresh-and-name-tags
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
