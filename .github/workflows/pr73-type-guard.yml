name: PR73 strict name tag verification
on:
  push:
    branches: [fix/pr73-strict-name-tags]
    paths: [.github/workflows/pr73-type-guard.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'c933103/openrailwaystyle' && github.ref == 'refs/heads/fix/pr73-strict-name-tags'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply tested narrow cache fallback fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('styles/app.mjs');s=p.read_text()
          old='''    const tags=stationNameTags(record.tags);
              if(tags===null)continue;
              records[key]={fetchedAt:record.fetchedAt,tags};'''
          # Construct exact indentation independently of YAML block indentation.
          old="    const tags=stationNameTags(record.tags);\n    if(tags===null)continue;\n    records[key]={fetchedAt:record.fetchedAt,tags};"
          new="    const tags=stationNameTags(record.tags);\n    if(tags===null){\n     // A malformed translation invalidates freshness, not valid sibling names.\n     const fallback=Object.fromEntries(Object.entries(record.tags).filter(([tag,value])=>(tag==='name'||tag.startsWith('name:'))&&typeof value==='string'));\n     if(Object.keys(fallback).length)records[key]={fetchedAt:0,tags:fallback};\n     continue;\n    }\n    records[key]={fetchedAt:record.fetchedAt,tags};"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          p=Path('tests/station-name-type-validation.test.mjs');s=p.read_text()
          old="    fetch:async()=>{requests++;return {ok:true,status:200,json:async()=>answer};}"
          new="    fetch:async()=>{requests++;if(answer instanceof Error)throw answer;if(typeof answer==='function')return answer();return {ok:true,status:200,json:async()=>answer};}"
          assert s.count(old)==1;s=s.replace(old,new)
          old="  return {load:()=>api.majorStationNameTags(station,{timeout:100}),saved:()=>JSON.parse(values.get(key)).records,requests:()=>requests};"
          new="  return {load:(timeout=100)=>api.majorStationNameTags(station,{timeout}),next:value=>{answer=value;},saved:()=>JSON.parse(values.get(key)).records,requests:()=>requests};"
          assert s.count(old)==1;s=s.replace(old,new)
          p.write_text(s)
          for folder in ['styles','scripts']:
            for f in Path(folder).rglob('*'):
              if f.suffix not in ['.mjs','.html','.js'] or 'vendor' in f.parts:continue
              original=f.read_text();updated=original.replace('20261003-112000','20261003-112900')
              if updated!=original:f.write_text(updated)
          PY
          cat >> tests/station-name-type-validation.test.mjs <<'JS'

          test('mixed cache name fields preserve usable OSM values as stale fallback when refresh fails',async()=>{
            for(const invalid of [null,123,true,[],{}]){
              const h=harness({name:'Cached native name','name:de':'Cached German name','name:en':invalid},Date.now(),new Error('offline'));
              const names=await h.load();
              assert.equal(names['node/1'].name,'Cached native name');
              assert.equal(names['node/1']['name:de'],'Cached German name');
              assert.equal('name:en' in names['node/1'],false);
              assert.ok(h.saved()['node/1'].fetchedAt<=Date.now()-7*86400000,'salvage must not become fresh');
              h.next({elements:[{type:'node',id:1,tags:{name:'Updated native name','name:en':'Updated English name'}}]});
              const updated=await h.load();
              assert.equal(h.requests(),2,'invalid cache freshness forces a later refresh');
              assert.equal(updated['node/1']['name:en'],'Updated English name');
              await h.load();
              assert.equal(h.requests(),2,'successful refresh restores normal freshness');
            }
          });
          test('mixed cache name fields survive a timed-out refresh without becoming fresh empty data',async()=>{
            const h=harness({name:'Cached native name','name:en':123},Date.now(),()=>new Promise(()=>{}));
            const names=await h.load(20);
            assert.equal(names['node/1'].name,'Cached native name');
            assert.equal('name:en' in names['node/1'],false);
            assert.ok(h.saved()['node/1'].fetchedAt<=Date.now()-7*86400000);
          });
          JS
          npm run build
          git diff --exit-code -- styles/world.style.json styles/major-stations.geojson
          npm test
          node --check styles/app.mjs
          git diff --check
      - name: Publish tested isolated fix only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr73-type-guard.yml
          git add styles/app.mjs styles/map-model.mjs styles/elevation.mjs styles/layer-semantics.mjs styles/index.html scripts/check-map-browser.mjs scripts/check-context-browser.mjs tests/station-name-type-validation.test.mjs
          git commit -m 'Keep valid cached OSM names as stale fallback when a sibling translation is malformed'
          git push origin HEAD:refs/heads/fix/pr73-strict-name-tags
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
