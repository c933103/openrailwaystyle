name: Validate and deploy world railway map
on:
  push:
    branches: [main, fix/atlas-relief, fix/atlas-contours-languages, fix/transport-destinations]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install style validator
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild world style
        run: npm run build
      - name: Check committed style is reproducible
        run: git diff --exit-code -- styles/world.style.json styles/major-stations.geojson
      - name: Validate speed semantics and MapLibre style
        run: npm test
      - name: Check JavaScript syntax
        run: node --check styles/app.mjs
      - name: Check public station search and CORS
        continue-on-error: true
        run: node scripts/check-search-api.mjs
      - name: Wait for initial snapshot build
        run: |
          for attempt in $(seq 1 40); do
            if git ls-remote --exit-code --heads origin rail-data; then exit 0; fi
            sleep 45
          done
          echo "No complete railway snapshot has been published."
          exit 1
      - name: Load published worldwide snapshot
        uses: actions/checkout@v4
        with:
          ref: rail-data
          path: lifecycle-data
      - name: Assemble site data
        run: |
          mkdir -p styles/data
          cp lifecycle-data/manifest.json styles/data/
          # Loading gauge by way ID for the zoom 0–6 overview (optional).
          if [ -f lifecycle-data/loading-gauge.json ]; then cp lifecycle-data/loading-gauge.json styles/data/; fi
          # The polar caps beyond 85.05° (optional).
          if [ -d lifecycle-data/polar ]; then cp -r lifecycle-data/polar styles/data/polar; fi
          cat lifecycle-data/lifecycle.pmtiles.part-* > /tmp/lifecycle.pmtiles
          pip install pmtiles==3.8.1
          python scripts/unpack-snapshot.py /tmp/lifecycle.pmtiles
          node scripts/build-overview-tiles.mjs
          cat lifecycle-data/lifecycle.geojson.gz.part-* > styles/data/lifecycle.geojson.gz
      - name: Load the published axle-load lookup
        run: |
          if git ls-remote --exit-code --heads origin axle-data; then
            git fetch --depth=1 origin axle-data:refs/remotes/origin/axle-data
            git show origin/axle-data:axle-load.json > styles/data/axle-load.json
          fi
      - name: Wait for first street-running snapshot
        run: |
          for attempt in $(seq 1 40); do
            if git ls-remote --exit-code --heads origin street-data; then exit 0; fi
            sleep 30
          done
          echo 'No complete street-running snapshot has been published.'
          exit 1
      - name: Load mapped street-running data
        uses: actions/checkout@v4
        with:
          ref: street-data
          path: street-snapshot
      - name: Assemble street-running tiles
        run: |
          mkdir -p styles/data/street-running
          cp -r street-snapshot/12 street-snapshot/index.json street-snapshot/manifest.json street-snapshot/street-running.geojson.gz styles/data/street-running/
      # Worldwide level crossings (crossings.yml). Until its first snapshot is
      # published the site deploys without them; the map then shows crossings
      # from zoom 15 only.
      - name: Load level crossings
        run: |
          mkdir -p styles/data/level-crossings
          if git ls-remote --exit-code --heads origin crossing-data; then
            git fetch --depth=1 origin crossing-data
            # Tiles, index, manifest and the ODbL table (crossings.tsv.gz).
            git archive FETCH_HEAD | tar -x -C styles/data/level-crossings --exclude=regions.json
          else
            echo '{"tiles":[]}' > styles/data/level-crossings/index.json
          fi
      # Operating branch lines for zooms 4–6 and metro lines for 7–9 (branch-lines.yml), filled in
      # region by region; without them the overview shows main lines only.
      - name: Load branch lines
        run: |
          mkdir -p styles/data/branch-lines
          # Exit status 2: no snapshot yet. Any other failure stops the
          # deploy rather than publishing the site without branch lines.
          status=0
          git ls-remote --exit-code --heads origin branch-data || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin branch-data
            git archive FETCH_HEAD | tar -x -C styles/data/branch-lines --exclude=state.json
          elif [ "$status" = 2 ]; then
            echo '{"tiles":[]}' > styles/data/branch-lines/index.json
          else
            echo "Could not look up the branch-data snapshot (git exit $status)"
            exit 1
          fi
      # Urban rail services for the Service view (service-routes.yml), filled
      # in region by region; without them the view shows the tracks only.
      - name: Load urban rail services
        run: |
          mkdir -p styles/data/service-routes
          status=0
          git ls-remote --exit-code --heads origin service-data || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin service-data
            git archive FETCH_HEAD | tar -x -C styles/data/service-routes --exclude=state.json
          elif [ "$status" = 2 ]; then
            echo '{"tiles":[]}' > styles/data/service-routes/index.json
          else
            echo "Could not look up the service-data snapshot (git exit $status)"
            exit 1
          fi
      - name: Load worldwide railway signals and energy supplies
        run: |
          for attempt in $(seq 1 40); do
            if git ls-remote --exit-code --heads origin traction-data; then break; fi
            if [ "$attempt" = 40 ]; then
              echo 'No complete railway facility snapshot has been published.'
              exit 1
            fi
            sleep 30
          done
          mkdir -p styles/data/traction
          git fetch --depth=1 origin traction-data
          git archive FETCH_HEAD | tar -x -C styles/data/traction
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          for (const kind of ['power','signals']) {
            const manifest=JSON.parse(await readFile(`styles/data/traction/${kind}/manifest.json`));
            assert.equal(manifest.complete,true,`Incomplete ${kind} facility snapshot`);
          }
          JS
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Start test server
        run: node scripts/serve.mjs &
      - name: Verify curated station labels and details on the globe
        run: node scripts/check-major-stations-browser.mjs
      - name: Verify roads, planning boundaries and rail-road interfaces
        run: node scripts/check-planning-browser.mjs
      - name: Verify transport and destination context
        run: node scripts/check-context-browser.mjs
      - name: Verify actual WebGL rendering and zoom-7 panning
        run: node scripts/check-map-browser.mjs
      - name: Verify Carto-only detailed polar rendering and view switching
        run: node scripts/check-polar-browser.mjs
      - name: Verify platform length labels and main Units selector
        run: node scripts/check-platform-browser.mjs
      - name: Verify platform references, signals and entrances
        run: node scripts/check-infrastructure-browser.mjs
      - name: Verify concurrent train controls, signals and traction supplies
        run: node scripts/check-signal-power-browser.mjs
      - name: Verify served build information on desktop and touch
        run: node scripts/check-build-browser.mjs
      - name: Save browser review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: browser-review
      - name: Save reviewable site
        uses: actions/upload-artifact@v4
        with:
          name: railway-world-site
          path: styles
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: railway-world-site
          path: styles
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: styles
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed vector tile bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {gunzipSync} from 'node:zlib';
          import assert from 'node:assert/strict';
          const base=process.env.PAGE_URL.replace(/\/$/,'')+'/data/lifecycle/';
          const index=JSON.parse(await readFile('styles/data/lifecycle/index.json'));
          const decode=b=>b[0]===31 && b[1]===139 ? gunzipSync(b) : b;
          for(const key of ['7/109/50',index.tiles[0],index.tiles.at(-1)]) {
            const expected=decode(await readFile(`styles/data/lifecycle/${key}.pbf.gz`));
            for(const encoding of ['identity','gzip, deflate, br, zstd, identity']) {
              for(let attempt=0;attempt<12;attempt++) {
                try {
                  const response=await fetch(base+key+'.pbf.gz',{headers:{'Accept-Encoding':encoding},signal:AbortSignal.timeout(20000)});
                  assert.equal(response.status,200);
                  assert.deepEqual(decode(Buffer.from(await response.arrayBuffer())),expected);
                  console.log('PASS: exact deployed vector tile',key,encoding);
                  break;
                } catch(error) {if(attempt===11) throw error;await new Promise(resolve=>setTimeout(resolve,5000));}
              }
            }
          }
          JS
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify the published map in Chromium
        env:
          MAP_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/check-map-browser.mjs
      - name: Verify published planning context
        env:
          MAP_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/check-planning-browser.mjs
      - name: Verify published transport and destinations
        env:
          MAP_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/check-context-browser.mjs
      - name: Save published map screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-map-review
          path: browser-review
