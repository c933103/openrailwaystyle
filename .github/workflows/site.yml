name: Validate and deploy world railway map
on:
  push:
    branches: [main, fix/atlas-relief, fix/atlas-contours-languages, fix/transport-destinations]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  facilities:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the first complete worldwide facility snapshot
        run: |
          # The resumable maintenance build has its own 110-minute budget.
          # Keep initial data readiness outside the browser validation budget.
          for attempt in $(seq 1 115); do
            status=0
            git ls-remote --exit-code --heads origin traction-data || status=$?
            if [ "$status" = 0 ]; then exit 0; fi
            if [ "$status" != 2 ]; then exit "$status"; fi
            sleep 60
          done
          echo 'No complete worldwide railway facility snapshot has been published.'
          exit 1
  # Which browser checks this run needs (scripts/ci-plan.mjs): all when the
  # site changes, only a check's own when only its files change, and none for
  # tests, docs and other pipelines.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      browser: ${{ steps.plan.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: node scripts/ci-plan.mjs
  # Builds and unit-tests the site and hands it to the browser jobs and the
  # deploy job. On main it also decides whether this exact code and data
  # already passed the browser checks in its pull request.
  validate:
    needs: facilities
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    outputs:
      key: ${{ steps.key.outputs.key }}
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install style validator
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild world style
        run: npm run build
      - name: Check committed style is reproducible
        run: git diff --exit-code -- styles/world.style.json styles/major-stations.geojson
      - name: Validate speed semantics and MapLibre style
        run: npm test
      - name: Check JavaScript syntax
        run: node --check styles/app.mjs
      - name: Check public station search and CORS
        continue-on-error: true
        run: node scripts/check-search-api.mjs
      - name: Wait for initial snapshot build
        run: |
          for attempt in $(seq 1 40); do
            if git ls-remote --exit-code --heads origin rail-data; then exit 0; fi
            sleep 45
          done
          echo "No complete railway snapshot has been published."
          exit 1
      - name: Load published worldwide snapshot
        uses: actions/checkout@v4
        with:
          ref: rail-data
          path: lifecycle-data
      - name: Assemble site data
        run: |
          mkdir -p styles/data
          cp lifecycle-data/manifest.json styles/data/
          # Loading gauge by way ID for the zoom 0–6 overview (optional).
          if [ -f lifecycle-data/loading-gauge.json ]; then cp lifecycle-data/loading-gauge.json styles/data/; fi
          # The polar caps beyond 85.05° (optional).
          if [ -d lifecycle-data/polar ]; then cp -r lifecycle-data/polar styles/data/polar; fi
          cat lifecycle-data/lifecycle.pmtiles.part-* > /tmp/lifecycle.pmtiles
          pip install pmtiles==3.8.1
          python scripts/unpack-snapshot.py /tmp/lifecycle.pmtiles
          node scripts/build-overview-tiles.mjs
          cat lifecycle-data/lifecycle.geojson.gz.part-* > styles/data/lifecycle.geojson.gz
      # Rare Han glyph slices (styles/rare-han.mjs): Jigmo's Plane 2 and 3
      # fonts in 256-character WOFF2 files, about 20 MB. The build script pins
      # the release and its SHA-256, so its own hash keys the cache.
      - name: Restore rare Han glyph slices
        id: rare-han
        uses: actions/cache@v4
        with:
          path: styles/fonts/rare-han-v1
          key: rare-han-${{ hashFiles('scripts/build-rare-han.py') }}
      - name: Build rare Han glyph slices
        if: steps.rare-han.outputs.cache-hit != 'true'
        run: |
          pip install fonttools==4.66.1 brotli==1.2.0
          python scripts/build-rare-han.py
      - name: Load the published axle-load lookup
        run: |
          if git ls-remote --exit-code --heads origin axle-data; then
            git fetch --depth=1 origin axle-data:refs/remotes/origin/axle-data
            git show origin/axle-data:axle-load.json > styles/data/axle-load.json
          fi
      - name: Wait for first street-running snapshot
        run: |
          for attempt in $(seq 1 40); do
            if git ls-remote --exit-code --heads origin street-data; then exit 0; fi
            sleep 30
          done
          echo 'No complete street-running snapshot has been published.'
          exit 1
      - name: Load mapped street-running data
        uses: actions/checkout@v4
        with:
          ref: street-data
          path: street-snapshot
      - name: Assemble street-running tiles
        run: |
          mkdir -p styles/data/street-running
          cp -r street-snapshot/12 street-snapshot/index.json street-snapshot/manifest.json street-snapshot/street-running.geojson.gz styles/data/street-running/
      # Worldwide level crossings (crossings.yml). Until its first snapshot is
      # published the site deploys without them; the map then shows crossings
      # from zoom 15 only.
      - name: Load level crossings
        run: |
          mkdir -p styles/data/level-crossings
          if git ls-remote --exit-code --heads origin crossing-data; then
            git fetch --depth=1 origin crossing-data
            # Tiles, index, manifest and the ODbL table (crossings.tsv.gz).
            git archive FETCH_HEAD | tar -x -C styles/data/level-crossings --exclude=regions.json
          else
            echo '{"tiles":[]}' > styles/data/level-crossings/index.json
          fi
      # Historic areas (heritage.yml); without them the planning context
      # shows no historic areas.
      - name: Load historic areas
        run: |
          mkdir -p styles/data/heritage
          # Exit status 2: no snapshot yet. Any other failure stops the
          # deploy rather than publishing the site without historic areas.
          status=0
          git ls-remote --exit-code --heads origin heritage-data || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin heritage-data
            git archive FETCH_HEAD | tar -x -C styles/data/heritage
          elif [ "$status" = 2 ]; then
            echo '{"tiles":[]}' > styles/data/heritage/index.json
          else
            echo "Could not look up the heritage-data snapshot (git exit $status)"
            exit 1
          fi
      # Operating branch lines for zooms 4–6 and metro lines for 7–9 (branch-lines.yml), filled in
      # region by region; without them the overview shows main lines only.
      - name: Load branch lines
        run: |
          mkdir -p styles/data/branch-lines
          # Exit status 2: no snapshot yet. Any other failure stops the
          # deploy rather than publishing the site without branch lines.
          status=0
          git ls-remote --exit-code --heads origin branch-data || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin branch-data
            git archive FETCH_HEAD | tar -x -C styles/data/branch-lines --exclude=state.json
          elif [ "$status" = 2 ]; then
            echo '{"tiles":[]}' > styles/data/branch-lines/index.json
          else
            echo "Could not look up the branch-data snapshot (git exit $status)"
            exit 1
          fi
      # Urban rail services for the Service view (service-routes.yml), filled
      # in region by region; without them the view shows the tracks only.
      - name: Load urban rail services
        run: |
          mkdir -p styles/data/service-routes
          status=0
          git ls-remote --exit-code --heads origin service-data || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin service-data
            git archive FETCH_HEAD | tar -x -C styles/data/service-routes --exclude=state.json
          elif [ "$status" = 2 ]; then
            echo '{"tiles":[]}' > styles/data/service-routes/index.json
          else
            echo "Could not look up the service-data snapshot (git exit $status)"
            exit 1
          fi
      - name: Add published headways to the OSM service tiles (timetables draw no lines)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/load-frequency-snapshot.py
          node scripts/rebuild-service-frequency.mjs
          # Compiled feeds are kept for matching, not published: no timetable
          # is applied yet. The manifest and inventory stay as coverage records.
          rm -rf styles/data/service-frequency/feeds styles/data/service-frequency/tiles
      - name: Load worldwide railway signals and energy supplies
        run: |
          mkdir -p styles/data/traction
          git fetch --depth=1 origin traction-data
          git archive FETCH_HEAD | tar -x -C styles/data/traction
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          for (const kind of ['power','signals']) {
            const manifest=JSON.parse(await readFile(`styles/data/traction/${kind}/manifest.json`));
            assert.equal(manifest.complete,true,`Incomplete ${kind} facility snapshot`);
          }
          JS
      # The code tree and a digest of the assembled data: a pull request
      # records it when its checks pass, and main skips the browser checks
      # only for the same key (snapshots move on their own).
      - name: Identify code and data
        id: key
        run: node scripts/ci-plan.mjs key
      - name: Look for a passed result for this code and data
        id: reuse
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          KEY: ${{ steps.key.outputs.key }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-plan.mjs reuse
      # Already-compressed tiles: zipping them again only costs time.
      - name: Save reviewable site
        uses: actions/upload-artifact@v4
        with:
          name: railway-world-site
          path: styles
          compression-level: 0
  # Browser checks use synthetic responses for every external provider.
  # The shared browser transport rejects unmocked egress before requests leave.
  # Actual first-party local/deployed assets are still read and checked.
  browser:
    name: browser (${{ matrix.group }})
    needs: [plan, validate]
    if: needs.plan.outputs.browser == 'true' && needs.validate.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GROUP: ${{ matrix.group }}
      CHECKS: ${{ matrix.checks }}
      PREPARE: ${{ matrix.prepare }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: railway-world-site
          path: styles
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Install WebKit for Safari installation checks
        if: matrix.group == 'controls' && contains(matrix.checks, 'check-pwa-install-browser.mjs')
        run: npx playwright install --with-deps webkit
      - name: Start test server
        run: node scripts/serve.mjs &
      # Real dated feeds are test fixtures, never a production city list;
      # this job's copy of the site is discarded afterwards.
      - name: Prepare check data
        if: matrix.prepare != ''
        run: bash -c "$PREPARE"
      - name: Verify Safari installation help in WebKit
        if: matrix.group == 'controls' && contains(matrix.checks, 'check-pwa-install-browser.mjs')
        env:
          ATLAS_PWA_ENGINE: webkit
        run: node scripts/check-pwa-install-browser.mjs
      - name: Run browser checks
        run: node scripts/run-browser-checks.mjs --concurrency 1 --label "$GROUP" $CHECKS
      - name: Save browser review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review-${{ matrix.group }}
          path: browser-review
          compression-level: 0
  # One status for all browser jobs, whichever ran.
  browser-checks:
    needs: [plan, validate, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          NEEDED: ${{ needs.plan.outputs.browser }}
          REUSED: ${{ needs.validate.outputs.reused }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "plan: $PLAN, browser checks needed: $NEEDED, earlier result reused: $REUSED, browser jobs: $BROWSER"
          [ "$PLAN" = success ] || exit 1
          [ "$BROWSER" = success ] || { [ "$BROWSER" = skipped ] && { [ "$NEEDED" != true ] || [ "$REUSED" = true ]; }; }
  # A pull request records the code and data that passed, so its merge into
  # main need not run the browser checks again (scripts/ci-plan.mjs). Pull
  # requests from forks cannot write statuses; their merges run the checks.
  record:
    needs: [plan, validate, browser-checks]
    if: always() && github.event_name == 'pull_request' && needs.plan.result == 'success' && needs.validate.result == 'success' && needs.browser-checks.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          URL: ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}
          KEY: ${{ needs.validate.outputs.key }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$URL" \
            -d "{\"state\":\"success\",\"context\":\"site/browser-checks\",\"description\":\"$KEY\",\"target_url\":\"$RUN\"}"
  deploy:
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.validate.result == 'success' && needs.browser-checks.result == 'success'
    needs: [validate, browser-checks]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: railway-world-site
          path: styles
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: styles
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed vector tile bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {gunzipSync} from 'node:zlib';
          import assert from 'node:assert/strict';
          const base=process.env.PAGE_URL.replace(/\/$/,'')+'/data/lifecycle/';
          const index=JSON.parse(await readFile('styles/data/lifecycle/index.json'));
          const decode=b=>b[0]===31 && b[1]===139 ? gunzipSync(b) : b;
          for(const key of ['7/109/50',index.tiles[0],index.tiles.at(-1)]) {
            const expected=decode(await readFile(`styles/data/lifecycle/${key}.pbf.gz`));
            for(const encoding of ['identity','gzip, deflate, br, zstd, identity']) {
              for(let attempt=0;attempt<12;attempt++) {
                try {
                  const response=await fetch(base+key+'.pbf.gz',{redirect:'error',headers:{'Accept-Encoding':encoding},signal:AbortSignal.timeout(20000)});
                  assert.equal(response.status,200);
                  assert.deepEqual(decode(Buffer.from(await response.arrayBuffer())),expected);
                  console.log('PASS: exact deployed vector tile',key,encoding);
                  break;
                } catch(error) {if(attempt===11) throw error;await new Promise(resolve=>setTimeout(resolve,5000));}
              }
            }
          }
          JS
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Exercise the deployed app's renderer against synthetic railway tiles;
      # do not make automated calls to the public OpenRailwayMap tile provider.
      - name: Verify published map with local railway fixture
        env:
          MAP_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/check-orm-fixture-browser.mjs
      - name: Save published map screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-map-review
          path: browser-review
