name: Validate and deploy world railway map
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install style validator
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild world style
        run: npm run build
      - name: Check committed style is reproducible
        run: git diff --exit-code -- styles/world.style.json
      - name: Validate speed semantics and MapLibre style
        run: npm test
      - name: Check JavaScript syntax
        run: node --check styles/app.mjs
      - name: Check public station search and CORS
        continue-on-error: true
        run: node scripts/check-search-api.mjs
      - name: Save reviewable site
        uses: actions/upload-artifact@v4
        with:
          name: railway-world-site
          path: styles
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: styles
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
