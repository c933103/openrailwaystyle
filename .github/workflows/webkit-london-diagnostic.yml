name: WebKit London diagnostic
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
jobs:
  compare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/webkit-london-readiness-diagnostic'
    runs-on: ubuntu-26.04
    timeout-minutes: 58
    env:
      REFERENCE_SHA: 2ee6efc7450230f609dbe217830895f278692063
      MAP_BASE_URL: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Stage the archived reference and build
        run: |
          git fetch --no-tags --depth=1 origin "$REFERENCE_SHA"
          mkdir mainline-output
          git archive "$REFERENCE_SHA" | tar -x -C mainline-output
          node scripts/verify-mainline-snapshot.mjs mainline-output --require-browser-acceptance
          npm run build
          mkdir -p styles/data/mainline-reference
          cp -r mainline-output/. styles/data/mainline-reference/
          npx playwright install --with-deps chromium webkit
      - name: Run the isolated and full-browser arms without publishing
        run: |
          mkdir -p london-diagnostics
          node scripts/serve.mjs >london-diagnostics/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --silent --show-error --fail --retry 20 --retry-connrefused --retry-delay 1 --max-time 5 "${MAP_BASE_URL}data/mainline-reference/manifest.json" >london-diagnostics/manifest.json
          # Run these first so reader-only evidence survives a later renderer stall.
          for mode in serial parallel; do
            set +e
            timeout --kill-after=10s 100s node scripts/check-webkit-london-reader.mjs "$mode" >"london-diagnostics/reader-$mode.log" 2>&1
            reader_status=$?
            set -e
            printf 'reader-%s %s\n' "$mode" "$reader_status" | tee -a london-diagnostics/status.txt
          done
          for mode in fresh transition suite; do
            set +e
            trace=0
            if [ "$mode" = suite ]; then trace=1; fi
            ATLAS_WEBKIT_REFERENCE_TRACE="$trace" ATLAS_WEBKIT_LONDON_DIAGNOSTIC="$mode" timeout 10m node scripts/check-mainline-reference-browser.mjs --published >"london-diagnostics/$mode.log" 2>&1
            status=$?
            set -e
            printf '%s %s\n' "$mode" "$status" | tee -a london-diagnostics/status.txt
            if [ -d browser-review ]; then mv browser-review "london-diagnostics/$mode-review"; fi
          done
          set +e
          ATLAS_WEBKIT_REFERENCE_TRACE=1 timeout 10m node scripts/check-mainline-reference-browser.mjs --published >london-diagnostics/full.log 2>&1
          full_status=$?
          set -e
          printf '%s %s\n' full "$full_status" | tee -a london-diagnostics/status.txt
          if [ -d browser-review ]; then mv browser-review london-diagnostics/full-review; fi
          # Prefer a suite prefix that actually stalled; otherwise replay the full trace.
          trace=london-diagnostics/full.log
          if ! grep -Fxq "suite 2" london-diagnostics/status.txt &&
             grep -q "^ATLAS_REFERENCE_PROTOCOL_START " london-diagnostics/suite.log; then
            trace=london-diagnostics/suite.log
          fi
          set +e
          timeout --kill-after=10s 12m node scripts/check-webkit-london-reader.mjs replay "$trace" >london-diagnostics/reader-replay.log 2>&1
          replay_status=$?
          set -e
          printf 'reader-replay %s %s\n' "$replay_status" "$trace" | tee -a london-diagnostics/status.txt
          test "$replay_status" -eq 0
          test "$full_status" -eq 0
          test -s london-diagnostics/full-review/mainline-reference.json
          for mode in fresh transition suite; do
            grep -q "^LONDON_DIAGNOSTIC_RESULT" "london-diagnostics/$mode.log"
            grep -Fxq "$mode 2" london-diagnostics/status.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-london-diagnostics
          path: london-diagnostics/
