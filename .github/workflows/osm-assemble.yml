# One OSM file from the regions' working copies (#330, B3; step 7c), to
# measure the assembly on the real files. It reads only our own release
# osm-extract (scripts/extract-release.mjs): the newest usable index and the
# region files it names. No OpenStreetMap provider is asked. The report goes
# to the step summary and an artifact; the assembled file is not kept.
# From it, the extract builds (#330, step 9) are made and, on main,
# published to their own branches (branch-lines-extract-data,
# service-routes-extract-data, station-points-extract-data,
# crossings-extract-data, traction-extract-data, conveying-extract-data,
# aerialways-extract-data, street-running-extract-data,
# heritage-extract-data, axle-load-extract-data, lifecycle-extract-data).
# The site uses
# one only when scripts/data-sources.json (or the DATA_SOURCES override)
# selects it (scripts/data-source.mjs); the Overpass branches are never written here.
# Invoked by hand or by the trusted extract rollout.
name: Assemble Geofabrik region extracts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: osm-assemble
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      refresh_pages: ${{ steps.pages_handoff.outputs.deploy }}
    # Only the publication of the extract builds writes, on main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record selected extract watermarks before publishing
        if: github.ref == 'refs/heads/main'
        id: pages_baseline
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_SOURCES: ${{ vars.DATA_SOURCES }}
        run: node scripts/extract-pages-handoff.mjs before
      - name: Install osmium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          osmium --version | head -1
      - name: Load the index and its region files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/extract-release.mjs load index.json
          test -s index.json || { echo "No working copies yet"; exit 1; }
          mkdir -p regions
          node -e 'for (const e of Object.values(JSON.parse(require("fs").readFileSync("index.json","utf8")).regions)) console.log(e.asset)' > assets.txt
          while read -r asset; do gh release download osm-extract --pattern "$asset" --dir regions; done < assets.txt
          echo "$(wc -l < assets.txt) region files, $(du -sh regions | cut -f1)"
      - name: Assemble
        run: |
          df -h . | tail -1
          node scripts/assemble-extracts.mjs index.json regions assembled.osm.pbf
          df -h . | tail -1
          { echo '# Assembled extract'; echo; echo '```json'; cat assembled.osm.pbf.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build and measure complete optional energy context
        # A failed optional candidate must not block independent datasets, but
        # the build must report the actual outcome, not a softened Jobs status.
        continue-on-error: true
        run: |
          set -eo pipefail
          energy_stage=build
          energy_result=incomplete
          report_energy_outcome() {
            local code=$?
            printf '### Optional energy candidate: %s (stage: %s, exit: %s)\n' "$energy_result" "$energy_stage" "$code" | tee -a "$GITHUB_STEP_SUMMARY" energy-network-diagnostic.log
            return "$code"
          }
          trap report_energy_outcome EXIT
          node --max-old-space-size=6144 scripts/build-extract-energy-network.mjs assembled.osm.pbf assembled.osm.pbf.json energy-network-extract 2>&1 | tee energy-network-diagnostic.log
          if test -f energy-network-extract/manifest.json; then
            energy_stage=validation
            node scripts/validate-energy-network.mjs energy-network-extract
            energy_stage=measurement
            node scripts/measure-energy-network.mjs energy-network-extract > energy-network-viewport.json
            cat energy-network-viewport.json >> "$GITHUB_STEP_SUMMARY"
            energy_result=validated-and-measured
          else
            energy_result=not-produced
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: energy-network-diagnostic
          path: energy-network-diagnostic.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: energy-network-candidate
          path: |
            energy-network-extract/
            energy-network-viewport.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Build branch lines from the extract
        # 6 GB, as the other large builds use. The first world build ran out
        # of Node's default 4 GB heap (2026-11-10); since then each way is
        # converted as it is read and kept elements are copies (germany:
        # 23,881 lines, 17 MB of table, 226 MB peak).
        run: |
          node --max-old-space-size=6144 scripts/build-extract-branch-lines.mjs assembled.osm.pbf assembled.osm.pbf.json branch-lines-extract | tee branch-lines-extract.json
          { echo '# Branch lines from the extract'; echo; echo '```json'; cat branch-lines-extract/manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish branch-lines-extract-data
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/extract-publish
          cd /tmp/extract-publish
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # One commit, replaced each time, as the Overpass branches are.
          git checkout -q --orphan branch-lines-extract-data
          cp -r "$GITHUB_WORKSPACE/branch-lines-extract/." .
          git add .
          git commit -q -m "Branch lines from the Geofabrik extracts $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git push --force origin HEAD:branch-lines-extract-data; then
            test "$(git ls-remote origin refs/heads/branch-lines-extract-data | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      - name: Build service routes from the extract
        # Measured on germany from the release (51,419 track ways): 188 MB of
        # table, 928 MB peak while tiling. The Overpass build tiles a world
        # table of ~275,000 ways (more history per way) within Node's default
        # heap; 6 GB, as the branch lines, leaves room.
        run: |
          node --max-old-space-size=6144 scripts/build-extract-service-routes.mjs assembled.osm.pbf assembled.osm.pbf.json service-routes-extract | tee service-routes-extract.json
          { echo '# Service routes from the extract'; echo; echo '```json'; node -e 'const {geometry, ...m} = JSON.parse(require("fs").readFileSync("service-routes-extract/manifest.json", "utf8")); console.log(JSON.stringify(m, null, 2))'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish service-routes-extract-data
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/service-publish
          cd /tmp/service-publish
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q --orphan service-routes-extract-data
          cp -r "$GITHUB_WORKSPACE/service-routes-extract/." .
          git add .
          git commit -q -m "Service routes from the Geofabrik extracts $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git push --force origin HEAD:service-routes-extract-data; then
            test "$(git ls-remote origin refs/heads/service-routes-extract-data | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      - name: Build station points from the extract
        # The world in a local run (2026-11-10 index): 193,416 stations,
        # about 3 minutes, mostly the one read of every tagged object.
        run: |
          node --max-old-space-size=6144 scripts/build-extract-station-points.mjs assembled.osm.pbf assembled.osm.pbf.json station-points-extract | tee station-points-extract.json
          { echo '# Station points from the extract'; echo; echo '```json'; cat station-points-extract/manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish station-points-extract-data
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/station-publish
          cd /tmp/station-publish
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q --orphan station-points-extract-data
          cp -r "$GITHUB_WORKSPACE/station-points-extract/." .
          git add .
          git commit -q -m "Station points from the Geofabrik extracts $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git push --force origin HEAD:station-points-extract-data; then
            test "$(git ls-remote origin refs/heads/station-points-extract-data | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      - name: Build level crossings from the extract
        # The world in a local run (2026-11-10 index): 1,233,077 crossings,
        # about 3 minutes, one read of the crossings and railway ways.
        run: |
          node --max-old-space-size=6144 scripts/build-extract-crossings.mjs assembled.osm.pbf assembled.osm.pbf.json crossings-extract | tee crossings-extract.json
          { echo '# Level crossings from the extract'; echo; echo '```json'; cat crossings-extract/manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish crossings-extract-data
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/crossings-publish
          cd /tmp/crossings-publish
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q --orphan crossings-extract-data
          cp -r "$GITHUB_WORKSPACE/crossings-extract/." .
          git add .
          git commit -q -m "Level crossings from the Geofabrik extracts $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git push --force origin HEAD:crossings-extract-data; then
            test "$(git ls-remote origin refs/heads/crossings-extract-data | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      - name: Build railway signals, energy supplies and power methods from the extract
        # The traction dataset in its layout: both signal supplements, the
        # energy supplies and the power methods. The world in a local run
        # (2026-11-10 index): signals 91 s, energy supplies 143 s, power
        # methods 150 s. source.json is complete only when every
        # traction-data file is written from a complete assembly.
        run: |
          node --max-old-space-size=6144 scripts/build-extract-traction.mjs assembled.osm.pbf assembled.osm.pbf.json traction-extract | tee traction-extract.json
          { echo '# Railway signals, energy supplies and power methods from the extract'; echo; echo '```json'; cat traction-extract/source.json traction-extract/signals/manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish traction-extract-data
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/traction-publish
          cd /tmp/traction-publish
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q --orphan traction-extract-data
          cp -r "$GITHUB_WORKSPACE/traction-extract/." .
          # The site reads the power GeoJSON as gzip only (site.yml removes
          # the raw copies). The extract's expanded power methods are over
          # GitHub's 100 MiB file limit as raw GeoJSON (107.27 MB on
          # 2026-11-25), so only the gzip copies are published here.
          for raw in power/*.geojson; do
            [ -e "$raw" ] || continue
            test -f "$raw.gz"
            rm "$raw"
          done
          # Name a file GitHub would refuse, rather than fail at the push.
          large=$(find . -path ./.git -prune -o -type f -size +104857600c -print)
          if [ -n "$large" ]; then
            echo "::error::Over GitHub's 100 MiB file limit: $large"
            exit 1
          fi
          git add .
          git commit -q -m "Traction data from the Geofabrik extracts $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git push --force origin HEAD:traction-extract-data; then
            test "$(git ls-remote origin refs/heads/traction-extract-data | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      - name: Build escalators, moving walkways, elevators and aerialways from the extract
        # One read of the ways for both datasets. The world in a local run
        # (2026-11-10 index): 82 s, 970 MB peak.
        run: |
          node --max-old-space-size=6144 scripts/build-extract-conveying.mjs assembled.osm.pbf assembled.osm.pbf.json conveying-extract | tee conveying-extract.json
          { echo '# Escalators, moving walkways, elevators and aerialways from the extract'; echo; echo '```json'; cat conveying-extract/conveying/manifest.json conveying-extract/aerialways/manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish conveying-extract-data and aerialways-extract-data
        if: github.ref == 'refs/heads/main'
        run: |
          for dataset in conveying aerialways; do
            mkdir "/tmp/$dataset-publish"
            cd "/tmp/$dataset-publish"
            git init -q
            git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
            git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git checkout -q --orphan "$dataset-extract-data"
            cp -r "$GITHUB_WORKSPACE/conveying-extract/$dataset/." .
            git add .
            git commit -q -m "$dataset from the Geofabrik extracts $(date -u +%Y-%m-%dT%H:%MZ)"
            if ! git push --force origin "HEAD:$dataset-extract-data"; then
              test "$(git ls-remote origin "refs/heads/$dataset-extract-data" | cut -f1)" = "$(git rev-parse HEAD)"
            fi
          done
      - name: Build street running from the extract
        # One read of the ways. The world in a local run (2026-11-10 index):
        # 73 s, 0.3 GB peak.
        run: |
          node --max-old-space-size=6144 scripts/build-extract-street-running.mjs assembled.osm.pbf assembled.osm.pbf.json street-running-extract | tee street-running-extract.json
          { echo '# Street running from the extract'; echo; echo '```json'; cat street-running-extract/manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish street-running-extract-data
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/street-running-publish
          cd /tmp/street-running-publish
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q --orphan street-running-extract-data
          cp -r "$GITHUB_WORKSPACE/street-running-extract/." .
          git add .
          git commit -q -m "Street running from the Geofabrik extracts $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git push --force origin HEAD:street-running-extract-data; then
            test "$(git ls-remote origin refs/heads/street-running-extract-data | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      - name: Build historic areas from the extract
        # One read for the ways and relations, a second for the relations'
        # member ways. The world in a local run (2026-11-10 index): 126 s,
        # 2.3 GB peak.
        run: |
          node --max-old-space-size=6144 scripts/build-extract-heritage.mjs assembled.osm.pbf assembled.osm.pbf.json heritage-extract | tee heritage-extract.json
          { echo '# Historic areas from the extract'; echo; echo '```json'; node -e 'const {coverage, ...m} = JSON.parse(require("fs").readFileSync("heritage-extract/manifest.json", "utf8")); console.log(JSON.stringify(m, null, 2))'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish heritage-extract-data
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/heritage-publish
          cd /tmp/heritage-publish
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q --orphan heritage-extract-data
          cp -r "$GITHUB_WORKSPACE/heritage-extract/." .
          git add .
          git commit -q -m "Historic areas from the Geofabrik extracts $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git push --force origin HEAD:heritage-extract-data; then
            test "$(git ls-remote origin refs/heads/heritage-extract-data | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      - name: Build the axle-load lookup from the extract
        # One read of the ways; Finland's polygon from the index this run
        # assembled. The world in a local run (2026-11-10 index): 105 s,
        # 0.35 GB peak.
        run: |
          node --max-old-space-size=6144 scripts/build-extract-axle-load.mjs assembled.osm.pbf assembled.osm.pbf.json index.json axle-load-extract | tee axle-load-extract.json
          { echo '# Axle-load lookup from the extract'; echo; echo '```json'; cat axle-load-extract/manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish axle-load-extract-data
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/axle-load-publish
          cd /tmp/axle-load-publish
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q --orphan axle-load-extract-data
          cp -r "$GITHUB_WORKSPACE/axle-load-extract/." .
          git add .
          git commit -q -m "Axle-load lookup from the Geofabrik extracts $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git push --force origin HEAD:axle-load-extract-data; then
            test "$(git ls-remote origin refs/heads/axle-load-extract-data | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      # The lifecycle dataset also carries the polar caps beyond 85°
      # (build-polar.mjs in snapshot.yml: ETOPO relief and Overpass features,
      # none in the extract filter). They are taken unchanged from the
      # Overpass build's published branch, with its commit; without them
      # the extract build stays not complete.
      - name: Take the polar caps from rail-data
        run: |
          status=0
          git ls-remote --exit-code --heads origin rail-data || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin rail-data
            if git cat-file -e FETCH_HEAD:polar; then
              mkdir -p /tmp/rail-polar
              git archive FETCH_HEAD polar | tar -x -C /tmp/rail-polar
              echo "POLAR_COMMIT=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
            fi
          elif [ "$status" != 2 ]; then
            exit "$status"
          fi
      - name: Build planned, construction and former railways from the extract
        # One read of the ways, each converted as read. The world in a local
        # run (2026-11-10 index): 179 s, 5.7 GB peak; then the tiles packed
        # by scripts/pack-snapshot.py, as snapshot.yml packs them.
        run: |
          node --max-old-space-size=6144 scripts/build-extract-lifecycle.mjs assembled.osm.pbf assembled.osm.pbf.json lifecycle-extract ${POLAR_COMMIT:+/tmp/rail-polar/polar "$POLAR_COMMIT"} | tee lifecycle-extract.json
          pip install pmtiles==3.8.1
          (cd lifecycle-extract && python ../scripts/pack-snapshot.py)
          { echo '# Planned, construction and former railways from the extract'; echo; echo '```json'; node -e 'const {parts, regression, ...m} = JSON.parse(require("fs").readFileSync("lifecycle-extract/snapshot/manifest.json", "utf8")); console.log(JSON.stringify({...m, regressionWays: regression.ways}, null, 2))'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish lifecycle-extract-data
        if: github.ref == 'refs/heads/main'
        # The rail-data layout: manifest.json, the loading-gauge list, and
        # the archive and table in 80 MB parts (Git blobs stay under the
        # hosting limit), with source.json, and the polar caps from rail-data
        # when they were found (otherwise source.json says not complete).
        run: |
          mkdir /tmp/lifecycle-publish
          cd /tmp/lifecycle-publish
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q --orphan lifecycle-extract-data
          cp "$GITHUB_WORKSPACE/lifecycle-extract/snapshot/manifest.json" "$GITHUB_WORKSPACE/lifecycle-extract/snapshot/loading-gauge.json" "$GITHUB_WORKSPACE/lifecycle-extract/source.json" .
          split -b 80M -d -a 3 "$GITHUB_WORKSPACE/lifecycle-extract/snapshot/lifecycle.pmtiles" lifecycle.pmtiles.part-
          split -b 80M -d -a 3 "$GITHUB_WORKSPACE/lifecycle-extract/snapshot/lifecycle.geojson.gz" lifecycle.geojson.gz.part-
          git add manifest.json loading-gauge.json source.json lifecycle.pmtiles.part-* lifecycle.geojson.gz.part-*
          if [ -d "$GITHUB_WORKSPACE/lifecycle-extract/snapshot/polar" ]; then
            cp -r "$GITHUB_WORKSPACE/lifecycle-extract/snapshot/polar" polar
            git add polar
          fi
          git commit -q -m "Planned, construction and former railways from the Geofabrik extracts $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git push --force origin HEAD:lifecycle-extract-data; then
            test "$(git ls-remote origin refs/heads/lifecycle-extract-data | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      - name: Check for advanced complete selected extracts
        if: github.ref == 'refs/heads/main'
        id: pages_handoff
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_SOURCES: ${{ vars.DATA_SOURCES }}
          PREVIOUS_WATERMARKS: ${{ steps.pages_baseline.outputs.watermarks }}
        run: node scripts/extract-pages-handoff.mjs after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assemble-report
          path: |
            assembled.osm.pbf.json
            branch-lines-extract/manifest.json
            service-routes-extract/manifest.json
            station-points-extract/manifest.json
            crossings-extract/manifest.json
            traction-extract/signals/manifest.json
            traction-extract/power/electricity-signals-manifest.json
            traction-extract/power/manifest.json
            traction-extract/power/methods-manifest.json
            traction-extract/source.json
            conveying-extract/conveying/manifest.json
            conveying-extract/aerialways/manifest.json
            street-running-extract/manifest.json
            heritage-extract/manifest.json
            axle-load-extract/manifest.json
            lifecycle-extract/snapshot/manifest.json
            lifecycle-extract/source.json
          if-no-files-found: ignore
          retention-days: 30

  refresh-pages:
    # Use the normal main-only deployment checks, not direct publication here.
    # This job alone may dispatch, and can be retried without building extracts.
    if: github.ref == 'refs/heads/main' && needs.assemble.outputs.refresh_pages == 'true'
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the normal Pages workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run site.yml --ref main
