name: Isolated PR 73 integration repair
on:
  push:
    branches: [repair/pr73-integration-20261003]
permissions:
  contents: write
concurrency:
  group: isolated-pr73-repair
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 250
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate current main and harden name loading
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags --depth=250 origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor origin/main HEAD; then python .github/repair-pr73.py; fi
          python .github/repair-pr73-hardening.py
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate and validate
        run: |
          npm run build
          node .github/repair-pr73-baseline.mjs
          npm test > /tmp/pr73-tests.log 2>&1 || { grep -A45 -B3 'not ok' /tmp/pr73-tests.log; tail -12 /tmp/pr73-tests.log; exit 1; }
          tail -12 /tmp/pr73-tests.log
          node --check styles/app.mjs
          git diff --check
      - name: Save repaired tree only on the isolated branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/repair/pr73-integration-20261003
          git add -u
          git diff --cached --stat
          if git diff --cached --quiet && ! test -f .git/MERGE_HEAD; then exit 0; fi
          git commit -m 'Repair curated search and bound OSM name refresh failures'
          git push origin HEAD:refs/heads/repair/pr73-integration-20261003
          echo "REPAIRED_COMMIT=$(git rev-parse HEAD)"
          echo "REPAIRED_TREE=$(git rev-parse HEAD^{tree})"
