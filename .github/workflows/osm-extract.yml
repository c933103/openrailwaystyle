# One download per planned Geofabrik region, filtered once for every dataset
# (#330, B2/B3). Each job downloads its region, checks it, filters it
# (scripts/extract-filter.mjs) and hands the filtered file over as an
# artifact (7 days). The publish job, on main only, is the one writer of the
# working copies: release osm-extract, one filtered file per region and an
# index naming them (scripts/extract-release.mjs). Regions refresh
# independently: one checked in this run takes its new file, every other
# region keeps its working copy. Run by hand only.
#
# Requests: the region plan as osm-gaps.yml makes it (the Geofabrik index,
# Natural Earth land from GitHub, one HEAD per region looked at), then per
# region to download.geofabrik.de: HEAD and .md5, and the file only when its
# size or MD5 differs from the working copy's source; two regions at a time.
# A plan that is not valid, or over 100 GiB, stops the run before any
# download. The parts no planned region covers (the plan's remainder, almost
# all sea) come from overpass-api.de as gap tiles (scripts/gap-tiles.mjs,
# scripts/acquire-gap-tiles.mjs): one request per tile, 10 s apart, never in
# parallel, at most 400 requests and 1 GB a run.
# With gaps_only, no region is downloaded: the run plans (one HEAD per region
# looked at), fetches the gap tiles and publishes them; every region keeps
# its working copy.
name: Geofabrik region extracts
on:
  workflow_dispatch:
    inputs:
      source_date:
        description: 'Dated Geofabrik files (YYYY-MM-DD); blank uses two days ago'
        required: false
      gaps_only:
        description: 'Only the gap tiles from Overpass: no region is downloaded'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: osm-extract
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Plan the regions
        env:
          SOURCE_DATE: ${{ inputs.source_date }}
        run: |
          status=0
          node --import ./scripts/overpass-meter.mjs scripts/plan-osm-regions.mjs plan "$SOURCE_DATE" || status=$?
          cat plan/plan.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit "$status"
      - name: Load the working copies' index
        env:
          GH_TOKEN: ${{ github.token }}
        # The newest index whose region files are all present; none on the
        # first run. An unreachable or inconsistent store stops the run.
        run: node scripts/extract-release.mjs load plan/index.json
      - name: Take only a valid plan
        id: matrix
        run: node scripts/extract-run.mjs matrix plan/plan.json plan/index.json
      # The parts no planned region covers, cut into tiles for Overpass
      # (scripts/gap-tiles.mjs).
      - name: Cut the remainder into gap tiles
        run: node scripts/gap-tiles.mjs plan/plan.json plan/gaps.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extract-plan
          path: plan
  extract:
    needs: plan
    if: ${{ !inputs.gaps_only }}
    runs-on: ubuntu-latest
    # GitHub-hosted jobs run at most 6 hours. The largest region (8 GiB) at
    # the slowest speed measured, 0.53 MB/s, needs about 270 minutes.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: extract ${{ matrix.region.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - name: Install osmium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          osmium --version | head -1
      # The largest regions (up to 8 GiB) need more than the runner's free
      # disk; the same space mainline-reference.yml frees.
      - name: Make room for one region
        if: matrix.region.bytes > 4294967296
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Download, check and filter the region
        env:
          REGION: ${{ toJSON(matrix.region) }}
          # 20 minutes of the job left for set-up and the upload; the script
          # keeps 20 more of its own for checking and filtering.
          REGION_TIME_BUDGET_MINUTES: 340
        run: |
          printf '%s' "$REGION" > region.json
          df -h . | tail -1
          node --import ./scripts/overpass-meter.mjs scripts/acquire-region-extract.mjs region.json extract
          df -h . | tail -1
      # A hand-over to the publish job, never the working copy. On failure
      # only failed.json, the reason, goes.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extract-${{ matrix.region.key }}
          path: |
            extract/extract.json
            extract/filtered.osm.pbf
            extract/failed.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
  # The gap tiles from Overpass, one request each, never in parallel
  # (scripts/acquire-gap-tiles.mjs). A tile that fails keeps its copy.
  gaps:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install osmium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
      - uses: actions/download-artifact@v4
        with:
          name: extract-plan
          path: plan
      - name: Fetch the gap tiles from Overpass
        # The run stops asking 10 minutes before the job limit, so its
        # outputs and meter line are written; no request starts unless its
        # whole 6-minute timeout fits in this budget.
        env:
          GAP_TIME_BUDGET_MINUTES: 170
        run: node --import ./scripts/overpass-meter.mjs scripts/acquire-gap-tiles.mjs plan/gaps.json gaps plan/index.json
      # Not named extract-*: the publish job downloads it into the same
      # directory as the regions.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gap-tiles
          path: gaps
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
  publish:
    needs: [plan, extract, gaps]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: osm-extract-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - uses: actions/download-artifact@v4
        with:
          name: extract-plan
          path: plan
      - uses: actions/download-artifact@v4
        with:
          pattern: extract-*
          path: measured
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gap-tiles
          path: measured
      - name: Report
        run: |
          node scripts/extract-run.mjs report plan/plan.json measured | tee report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      # Only main keeps the working copies. Region files first, the index
      # after them, older assets deleted last; a region that failed or was
      # not measured keeps its working copy.
      - name: Publish the working copies
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATION: ${{ github.run_id }}
        run: |
          GENERATION="$(date -u +%Y%m%dT%H%M%SZ)-$GENERATION" node scripts/extract-release.mjs publish plan/plan.json measured plan/gaps.json | tee published.md
          cat published.md >> "$GITHUB_STEP_SUMMARY"
          cat published.md >> report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extract-report
          path: report.md
