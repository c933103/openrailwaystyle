# One download per planned Geofabrik region, filtered once for every dataset
# (#330, B2). This first form only measures: each job downloads its region,
# checks it, filters it (scripts/extract-filter.mjs), records the sizes and
# times, and deletes everything but the record. Nothing is pushed, published
# or kept beyond this run's artifacts. Run by hand only.
#
# Requests: the region plan as osm-gaps.yml makes it (the Geofabrik index,
# Natural Earth land from GitHub, one HEAD per region looked at), then three
# per region to download.geofabrik.de (HEAD, .md5, the file), two regions at a
# time. A plan that is not valid, or over 100 GiB, stops the run before any
# download.
name: Measure Geofabrik region extracts
on:
  workflow_dispatch:
    inputs:
      source_date:
        description: 'Dated Geofabrik files (YYYY-MM-DD); blank uses two days ago'
        required: false
permissions:
  contents: read
concurrency:
  group: osm-extract
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Plan the regions
        env:
          SOURCE_DATE: ${{ inputs.source_date }}
        run: |
          status=0
          node --import ./scripts/overpass-meter.mjs scripts/plan-osm-regions.mjs plan "$SOURCE_DATE" || status=$?
          cat plan/plan.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit "$status"
      - name: Take only a valid plan
        id: matrix
        run: node scripts/extract-run.mjs matrix plan/plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extract-plan
          path: plan
  extract:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: extract ${{ matrix.region.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - name: Install osmium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          osmium --version | head -1
      # The largest regions (up to 8 GiB) need more than the runner's free
      # disk; the same space mainline-reference.yml frees.
      - name: Make room for one region
        if: matrix.region.bytes > 4294967296
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Download, check and filter the region
        env:
          REGION: ${{ toJSON(matrix.region) }}
        run: |
          printf '%s' "$REGION" > region.json
          df -h . | tail -1
          node --import ./scripts/overpass-meter.mjs scripts/acquire-region-extract.mjs region.json extract
          df -h . | tail -1
          rm -f extract/filtered.osm.pbf
      - uses: actions/upload-artifact@v4
        with:
          name: extract-${{ matrix.region.key }}
          path: extract/extract.json
          retention-days: 30
  report:
    needs: [plan, extract]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - uses: actions/download-artifact@v4
        with:
          name: extract-plan
          path: plan
      - uses: actions/download-artifact@v4
        with:
          pattern: extract-*
          path: measured
      - name: Report
        run: |
          node scripts/extract-run.mjs report plan/plan.json measured | tee report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: extract-report
          path: report.md
