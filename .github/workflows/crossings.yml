name: Refresh worldwide level crossings
on:
  workflow_dispatch:
  # Started on Sunday from 03:23 UTC by osm-updates.yml (one Overpass dataset
  # at a time): the crossings changed in the week, plus a full refresh of the
  # longest-unchecked regions (about 5 MB).
permissions:
  contents: write
  actions: write
concurrency:
  group: crossing-data
  cancel-in-progress: false
jobs:
  snapshot:
    # Only main publishes the shared snapshot (branches and manual runs
    # started from other refs never replace it).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The first run fetches the whole world one region at a time.
    timeout-minutes: 330
    env:
      CROSSING_CHECKPOINT_DIR: /tmp/crossing-rebuild-work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Load the previous table
        id: previous
        run: |
          set -eu
          status=0
          git ls-remote --exit-code --heads origin crossing-data >/dev/null || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin crossing-data
            echo "PREVIOUS_SNAPSHOT_ID=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
            mkdir -p /tmp/previous-crossings
            git archive FETCH_HEAD -- crossings.tsv.gz regions.json | tar -x -C /tmp/previous-crossings
          elif [ "$status" = 2 ]; then
            echo 'PREVIOUS_SNAPSHOT_ID=none' >> "$GITHUB_ENV"
          else
            echo "Cannot safely identify previous snapshot (status $status)"
            exit "$status"
          fi
          # Match the builder's fallback decision before touching staging.
          node --input-type=module <<'JS'
          import {readFile, appendFile} from 'node:fs/promises';
          import {gunzipSync} from 'node:zlib';
          import {readTable} from './scripts/crossing-data.mjs';
          let full = true;
          try {
            const saved = JSON.parse(await readFile('/tmp/previous-crossings/regions.json', 'utf8'));
            if (saved.version === 3) {
              readTable(gunzipSync(await readFile('/tmp/previous-crossings/crossings.tsv.gz')).toString());
              full = !saved.since;
            }
          } catch { /* The builder will fall back to a full rebuild. */ }
          await appendFile(process.env.GITHUB_OUTPUT, `full_rebuild=${full}\n`);
          JS
      - name: Restore isolated full-rebuild staging
        if: steps.previous.outputs.full_rebuild == 'true'
        run: |
          set -eu
          status=0
          git ls-remote --exit-code --heads origin crossing-rebuild-work >/dev/null || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin crossing-rebuild-work
            echo "PREVIOUS_CHECKPOINT_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
            git ls-tree -rl FETCH_HEAD > /tmp/crossing-checkpoint-tree.txt
            node scripts/crossing-checkpoint.mjs tree /tmp/crossing-checkpoint-tree.txt
            mkdir -p "$CROSSING_CHECKPOINT_DIR"
            git archive FETCH_HEAD | tar -x -C "$CROSSING_CHECKPOINT_DIR"
          elif [ "$status" = 2 ]; then
            echo 'PREVIOUS_CHECKPOINT_SHA=' >> "$GITHUB_ENV"
          elif [ "$status" != 2 ]; then
            echo "Cannot safely check rebuild staging (status $status)"
            exit "$status"
          fi
      - name: Update level crossings from OpenStreetMap
        id: update
        run: |
          if [ -f /tmp/previous-crossings/crossings.tsv.gz ]; then export PREVIOUS_DATA=/tmp/previous-crossings; fi
          node scripts/build-crossings.mjs
      # Ordinary failures preserve completed leaves; cancellation/runner loss
      # is not guaranteed to reach this step. Never publish staging as live data.
      - name: Preserve validated full-rebuild progress
        if: ${{ !cancelled() && steps.update.outputs.checkpoint == 'true' && (steps.update.outcome == 'success' || steps.update.outcome == 'failure') }}
        run: |
          set -eu
          if [ ! -f "$CROSSING_CHECKPOINT_DIR/state.json" ]; then exit 0; fi
          node scripts/crossing-checkpoint.mjs validate
          mkdir /tmp/crossing-checkpoint-publish
          cd /tmp/crossing-checkpoint-publish
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan crossing-rebuild-work
          cp "$CROSSING_CHECKPOINT_DIR/"* .
          git add .
          git commit -q -m "Full-rebuild crossing progress $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! git push --force-with-lease="refs/heads/crossing-rebuild-work:$PREVIOUS_CHECKPOINT_SHA" origin HEAD:crossing-rebuild-work; then
            test "$(git ls-remote origin refs/heads/crossing-rebuild-work | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      - name: Publish complete data snapshot
        run: |
          mkdir /tmp/crossing-publish
          cd /tmp/crossing-publish
          git init
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # One commit, replaced each time: the tiles change every week and
          # their history is not needed.
          git checkout --orphan crossing-data
          cp -r "$GITHUB_WORKSPACE/crossing-data/." .
          git add .
          git commit -q -m "Worldwide level crossings $(date -u +%Y-%m-%d)"
          if ! git push --force origin HEAD:crossing-data; then
            # The server may have accepted the update before the connection
            # reported failure. Accept only this exact published commit.
            test "$(git ls-remote origin refs/heads/crossing-data | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      - name: Redeploy the site with refreshed data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main
