name: Refresh worldwide historic areas
on:
  workflow_dispatch:
  # Started on the 3rd of each month from 21:23 UTC by osm-updates.yml (one
  # Overpass dataset at a time): historic areas change slowly.
permissions:
  contents: write
  actions: write
concurrency:
  group: heritage-data
  cancel-in-progress: false
jobs:
  snapshot:
    # Only main publishes the shared snapshot.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read the regions and elements of the published snapshot
        id: snapshot
        run: |
          # A region split for size last time is asked for in its parts.
          # Without a readable snapshot the builder uses the 45-degree grid.
          if git fetch --depth=1 origin heritage-data && git show FETCH_HEAD:manifest.json > "$RUNNER_TEMP/heritage-previous.json"; then
            echo "HERITAGE_PREVIOUS_MANIFEST=$RUNNER_TEMP/heritage-previous.json" >> "$GITHUB_ENV"
            echo "id=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          else
            # No snapshot read: only this run's own attempts share a cache.
            echo "id=none-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          fi
          # Each region's elements, with their query and database time: the
          # region takes only its changes since then. Without them (the first
          # run, or a region new since) it is downloaded in full.
          mkdir -p "$RUNNER_TEMP/heritage-previous"
          if git --work-tree="$RUNNER_TEMP/heritage-previous" checkout FETCH_HEAD -- elements 2>/dev/null; then
            echo "HERITAGE_PREVIOUS_ELEMENTS=$RUNNER_TEMP/heritage-previous" >> "$GITHUB_ENV"
          fi
      # The regions a failed run completed (the builder's .snapshot-cache
      # responses, used only for the same query), keyed to the published
      # snapshot that run started from: a retry from the same snapshot asks
      # Overpass only for what is missing. Once a newer snapshot is
      # published the key changes, so older responses are never used over
      # newer published data. No age limit.
      - uses: actions/cache/restore@v4
        with:
          path: .snapshot-cache
          key: heritage-regions-v2-${{ steps.snapshot.outputs.id }}
          restore-keys: heritage-regions-v2-${{ steps.snapshot.outputs.id }}-
      - name: Build historic areas from OpenStreetMap
        run: node --import ./scripts/overpass-meter.mjs scripts/build-heritage.mjs
      # Kept only when the build failed: a successful run published the
      # regions, and the next run starts from the published elements. Each
      # attempt saves under its own key, since a saved cache cannot be
      # changed and a re-run keeps its run id.
      - uses: actions/cache/save@v4
        if: failure()
        with:
          path: .snapshot-cache
          key: heritage-regions-v2-${{ steps.snapshot.outputs.id }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish complete data snapshot
        run: |
          mkdir /tmp/heritage-publish
          cd /tmp/heritage-publish
          git init
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # One commit, replaced each time: the history of the tiles is not needed.
          git checkout --orphan heritage-data
          cp -r "$GITHUB_WORKSPACE/heritage-data/." .
          git add .
          git commit -q -m "Worldwide historic areas $(date -u +%Y-%m-%d)"
          if ! git push --force origin HEAD:heritage-data; then
            # The server may have accepted the update before the connection
            # reported failure. Accept only this exact published commit.
            test "$(git ls-remote origin refs/heads/heritage-data | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      - name: Redeploy the site with refreshed data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main
