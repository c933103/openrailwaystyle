name: Refresh escalators, moving walkways and elevators
on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * 0'
  push:
    branches: [main]
    paths: ['scripts/build-conveying.mjs', 'scripts/conveying-data.mjs', 'styles/conveying.mjs', '.github/workflows/conveying.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: conveying-data
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Verify Node 26 security baseline
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if (major !== 26 || minor < 12 || (minor === 12 && patch < 1)) throw new Error("CI requires patched Node 26.12.1+"); console.log(process.version)'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Extract every mapped escalator, moving walkway and elevator way
        run: node scripts/build-conveying.mjs
      - name: Publish complete data snapshot
        # Only main publishes the shared snapshot.
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/conveying-publish
          cd /tmp/conveying-publish
          git init
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.https://github.com/.extraheader "$(git -C "$GITHUB_WORKSPACE" config http.https://github.com/.extraheader)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch origin conveying-data; then git checkout -b conveying-data FETCH_HEAD; else git checkout --orphan conveying-data; fi
          git rm -rf --ignore-unmatch .
          cp -r "$GITHUB_WORKSPACE/conveying-data/." .
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh escalators, moving walkways and elevators"
          if ! git push origin HEAD:conveying-data; then
            # The server may have accepted the update before the connection
            # reported failure. Accept only this exact published commit.
            test "$(git ls-remote origin refs/heads/conveying-data | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      - name: Redeploy the site with refreshed data
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main
