name: Deliver service acquisition status
on:
  workflow_run:
    workflows: ['Build urban rail services']
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: service-status-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: >-
      github.repository == 'c933103/openrailwaystyle' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify offline metadata and trust fixtures
        run: node --test tests/service-status-delivery.test.mjs
      - name: Deliver changed zero-box acquisition status
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/service-status-delivery.mjs
