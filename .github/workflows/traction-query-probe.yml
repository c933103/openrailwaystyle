name: Probe bounded facility tag prefilter
on:
  push:
    branches: [feature/signal-power-facilities]
    paths: [.github/workflows/traction-query-probe.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: traction-query-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore completed raw responses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .snapshot-cache /tmp/traction-cache
          gh release download traction-facilities-cache --pattern traction-facilities-cache.tar.zst --dir /tmp
          tar --zstd -xf /tmp/traction-facilities-cache.tar.zst -C /tmp/traction-cache
          cp -a /tmp/traction-cache/.snapshot-cache/. .snapshot-cache/
      - name: Test one bounded dense region
        run: |
          node --network-family-autoselection-attempt-timeout=2000 --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {powerFacilitiesGeoJSON} from './scripts/power-facility-data.mjs';
          const query="[out:json][timeout:240][maxsize:134217728];(nwr[\"railway\"~\"(^|;)[[:space:]]*(yes|rail|narrow_gauge|light_rail|subway|tram|monorail|power_station|substation)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"construction:railway\"~\"(^|;)[[:space:]]*(yes|rail|narrow_gauge|light_rail|subway|tram|monorail|power_station|substation)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"proposed:railway\"~\"(^|;)[[:space:]]*(yes|rail|narrow_gauge|light_rail|subway|tram|monorail|power_station|substation)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"disused:railway\"~\"(^|;)[[:space:]]*(yes|rail|narrow_gauge|light_rail|subway|tram|monorail|power_station|substation)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"abandoned:railway\"~\"(^|;)[[:space:]]*(yes|rail|narrow_gauge|light_rail|subway|tram|monorail|power_station|substation)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"razed:railway\"~\"(^|;)[[:space:]]*(yes|rail|narrow_gauge|light_rail|subway|tram|monorail|power_station|substation)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"demolished:railway\"~\"(^|;)[[:space:]]*(yes|rail|narrow_gauge|light_rail|subway|tram|monorail|power_station|substation)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"removed:railway\"~\"(^|;)[[:space:]]*(yes|rail|narrow_gauge|light_rail|subway|tram|monorail|power_station|substation)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"substation\"~\"(^|;)[[:space:]]*(traction)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"transformer\"~\"(^|;)[[:space:]]*(traction)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"usage\"~\"(^|;)[[:space:]]*(railway|traction)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"landuse\"~\"(^|;)[[:space:]]*(railway)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"frequency\"~\"(^|;)[[:space:]]*(16\\\\.(7|67|66[67]?))[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);)->.hints;nwr.hints(if:is_tag(\"power\")||is_tag(\"man_made\")||is_tag(\"construction:power\")||is_tag(\"construction:man_made\")||is_tag(\"proposed:power\")||is_tag(\"proposed:man_made\")||is_tag(\"disused:power\")||is_tag(\"disused:man_made\")||is_tag(\"abandoned:power\")||is_tag(\"abandoned:man_made\")||is_tag(\"razed:power\")||is_tag(\"razed:man_made\")||is_tag(\"demolished:power\")||is_tag(\"demolished:man_made\")||is_tag(\"removed:power\")||is_tag(\"removed:man_made\"))->.potential;(nwr.potential[\"power\"~\"(^|;)[[:space:]]*(substation|plant|generator|converter|frequency_converter|transformer)[[:space:]]*(;|$)\",i];nwr.potential[\"man_made\"~\"(^|;)[[:space:]]*(water_tower|storage_tank)[[:space:]]*(;|$)\",i];nwr[\"railway\"~\"(^|;)[[:space:]]*(fuel|coaling_facility|water_tower|water_tank|water_crane|power_supply|preheating|power_station|substation)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"railway:electricity\"~\"(^|;)[[:space:]]*(power_supply)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr.potential[\"construction:power\"~\"(^|;)[[:space:]]*(substation|plant|generator|converter|frequency_converter|transformer)[[:space:]]*(;|$)\",i];nwr.potential[\"construction:man_made\"~\"(^|;)[[:space:]]*(water_tower|storage_tank)[[:space:]]*(;|$)\",i];nwr[\"construction:railway\"~\"(^|;)[[:space:]]*(fuel|coaling_facility|water_tower|water_tank|water_crane|power_supply|preheating|power_station|substation)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"construction:railway:electricity\"~\"(^|;)[[:space:]]*(power_supply)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr.potential[\"proposed:power\"~\"(^|;)[[:space:]]*(substation|plant|generator|converter|frequency_converter|transformer)[[:space:]]*(;|$)\",i];nwr.potential[\"proposed:man_made\"~\"(^|;)[[:space:]]*(water_tower|storage_tank)[[:space:]]*(;|$)\",i];nwr[\"proposed:railway\"~\"(^|;)[[:space:]]*(fuel|coaling_facility|water_tower|water_tank|water_crane|power_supply|preheating|power_station|substation)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"proposed:railway:electricity\"~\"(^|;)[[:space:]]*(power_supply)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr.potential[\"disused:power\"~\"(^|;)[[:space:]]*(substation|plant|generator|converter|frequency_converter|transformer)[[:space:]]*(;|$)\",i];nwr.potential[\"disused:man_made\"~\"(^|;)[[:space:]]*(water_tower|storage_tank)[[:space:]]*(;|$)\",i];nwr[\"disused:railway\"~\"(^|;)[[:space:]]*(fuel|coaling_facility|water_tower|water_tank|water_crane|power_supply|preheating|power_station|substation)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"disused:railway:electricity\"~\"(^|;)[[:space:]]*(power_supply)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr.potential[\"abandoned:power\"~\"(^|;)[[:space:]]*(substation|plant|generator|converter|frequency_converter|transformer)[[:space:]]*(;|$)\",i];nwr.potential[\"abandoned:man_made\"~\"(^|;)[[:space:]]*(water_tower|storage_tank)[[:space:]]*(;|$)\",i];nwr[\"abandoned:railway\"~\"(^|;)[[:space:]]*(fuel|coaling_facility|water_tower|water_tank|water_crane|power_supply|preheating|power_station|substation)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"abandoned:railway:electricity\"~\"(^|;)[[:space:]]*(power_supply)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr.potential[\"razed:power\"~\"(^|;)[[:space:]]*(substation|plant|generator|converter|frequency_converter|transformer)[[:space:]]*(;|$)\",i];nwr.potential[\"razed:man_made\"~\"(^|;)[[:space:]]*(water_tower|storage_tank)[[:space:]]*(;|$)\",i];nwr[\"razed:railway\"~\"(^|;)[[:space:]]*(fuel|coaling_facility|water_tower|water_tank|water_crane|power_supply|preheating|power_station|substation)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"razed:railway:electricity\"~\"(^|;)[[:space:]]*(power_supply)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr.potential[\"demolished:power\"~\"(^|;)[[:space:]]*(substation|plant|generator|converter|frequency_converter|transformer)[[:space:]]*(;|$)\",i];nwr.potential[\"demolished:man_made\"~\"(^|;)[[:space:]]*(water_tower|storage_tank)[[:space:]]*(;|$)\",i];nwr[\"demolished:railway\"~\"(^|;)[[:space:]]*(fuel|coaling_facility|water_tower|water_tank|water_crane|power_supply|preheating|power_station|substation)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"demolished:railway:electricity\"~\"(^|;)[[:space:]]*(power_supply)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr.potential[\"removed:power\"~\"(^|;)[[:space:]]*(substation|plant|generator|converter|frequency_converter|transformer)[[:space:]]*(;|$)\",i];nwr.potential[\"removed:man_made\"~\"(^|;)[[:space:]]*(water_tower|storage_tank)[[:space:]]*(;|$)\",i];nwr[\"removed:railway\"~\"(^|;)[[:space:]]*(fuel|coaling_facility|water_tower|water_tank|water_crane|power_supply|preheating|power_station|substation)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25);nwr[\"removed:railway:electricity\"~\"(^|;)[[:space:]]*(power_supply)[[:space:]]*(;|$)\",i](45,5.625,50.625,11.25););out body center qt;";
          console.log('Query SHA256',createHash('sha256').update(query).digest('hex'));
          const started=Date.now();
          const response=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:new URLSearchParams({data:query}),headers:{'User-Agent':'RailwayAtlas-energy-supplies/1.0 (+https://github.com/c933103/openrailwaystyle)'},signal:AbortSignal.timeout(300000)});
          const body=await response.text();console.log('Response',response.status,'elapsed seconds',(Date.now()-started)/1000,'bytes',Buffer.byteLength(body));
          if(!response.ok)throw new Error(body.slice(0,300));
          const json=JSON.parse(body),data=powerFacilitiesGeoJSON(json),counts={};
          for(const f of data.features)counts[f.properties.power_kind]=(counts[f.properties.power_kind]||0)+1;
          console.log('Complete candidate query',JSON.stringify({raw:json.elements.length,facilities:data.features.length,counts,timestamp:json.osm3s?.timestamp_osm_base}));
          await writeFile('.snapshot-cache/power-facilities-v6-45_5.625_50.625_11.25.json',JSON.stringify({query,response:json}));
          JS
      - name: Preserve validated raw responses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar --zstd -cf /tmp/traction-facilities-cache.tar.zst .snapshot-cache
          gh release upload traction-facilities-cache /tmp/traction-facilities-cache.tar.zst --clobber
