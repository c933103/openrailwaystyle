name: Remove closed railway reference previews
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
jobs:
  remove-preview:
    # Fork builds use read-only artifacts and never create a preview ref.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: mainline-publication-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Delete only this closed PR's generated data preview
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: mainline-preview-${{ github.event.pull_request.number }}
        run: |
          python - <<'PYTHON'
          import json, os, re, subprocess

          preview = os.environ['PREVIEW']
          repository = os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'mainline-preview-[1-9][0-9]*', preview):
              raise ValueError('Unexpected generated-preview name')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
              raise ValueError('Invalid repository')
          expected = f'refs/heads/{preview}'


          def request(method):
              # The singular GET endpoint resolves one exact ref, never a prefix list.
              kind = 'ref' if method == 'GET' else 'refs'
              endpoint = f'repos/{repository}/git/{kind}/heads/{preview}'
              result = subprocess.run(['gh', 'api', '--include', '--method', method, endpoint],
                                      capture_output=True, text=True, timeout=30)
              header, separator, body = result.stdout.partition('\n\n')
              match = re.match(r'HTTP/\S+ (\d{3})(?: |$)', header)
              if not match or not separator:
                  raise RuntimeError(f'Preview {method} returned no HTTP status')
              status = int(match[1])
              if 200 <= status < 300 and result.returncode:
                  raise RuntimeError(f'Preview {method} command failed despite HTTP {status}')
              return status, body


          def exists():
              status, body = request('GET')
              if status == 404:
                  return False
              if status != 200:
                  raise RuntimeError(f'Preview GET failed (HTTP {status})')
              data = json.loads(body)
              if not isinstance(data, dict) or data.get('ref') != expected:
                  raise ValueError('Preview lookup did not return the exact requested ref')
              return True


          if not exists():
              print('Generated preview is already absent; nothing to delete.')
          else:
              status, _ = request('DELETE')
              if status == 204:
                  print('Deleted this closed PR generated preview.')
              elif status in (404, 422) and not exists():
                  print('Generated preview became absent before deletion completed.')
              else:
                  raise RuntimeError(f'Preview DELETE failed (HTTP {status})')
          PYTHON
