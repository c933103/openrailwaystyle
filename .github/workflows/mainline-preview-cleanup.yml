name: Remove closed railway reference previews
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
jobs:
  remove-preview:
    # Fork builds use read-only artifacts and never create a preview ref.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete only this closed PR's generated data preview
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: mainline-preview-${{ github.event.pull_request.number }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$PREVIEW" --jq .ref 2>/dev/null || true)
          if [ -n "$status" ]; then gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$PREVIEW"; fi
