name: Diagnose regional railway coverage
on:
  push:
    branches: [fix/regional-planned-lines]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/diagnose-regional.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-data-diagnostics
          path: regional-diagnostics
