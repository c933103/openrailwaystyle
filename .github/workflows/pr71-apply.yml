name: PR71 apply verified repair
on:
  push:
    branches: [fix/attribution-info-compact]
    paths: ['.github/pr71-edits.json', '.github/workflows/pr71-apply.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge exact main and apply hash-checked edits
        shell: bash
        run: |
          set -euo pipefail
          cp .github/pr71-edits.json /tmp/pr71-edits.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags --depth=200 origin main
          test "$(git rev-parse FETCH_HEAD)" = 'beb6fd445e6b37e3524ec9e4b12dff5576b54097'
          git merge --no-commit --no-ff FETCH_HEAD || test -n "$(git diff --name-only --diff-filter=U)"
          python - <<'PY'
          import pathlib, re, json, hashlib, subprocess
          allowed = {'styles/app.mjs','styles/elevation.mjs','styles/index.html','styles/map-model.mjs','tests/startup.test.mjs'}
          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          if not set(conflicts).issubset(allowed): raise SystemExit('Unexpected conflicts: '+repr(conflicts))
          for name in conflicts:
              p=pathlib.Path(name); text=p.read_text()
              text,count=re.subn(r'^<<<<<<< HEAD\n.*?^=======\n(.*?)^>>>>>>>[^\n]*\n',lambda m:m[1],text,flags=re.M|re.S)
              if not count or re.search(r'^(<<<<<<<|=======|>>>>>>>)',text,re.M): raise SystemExit('Unresolved '+name)
              if name=='tests/startup.test.mjs': text=text.replace('and keeps attribution open','and keeps compact attribution')
              p.write_text(text)
              subprocess.run(['git','add','--',name],check=True)
          data=json.loads(pathlib.Path('/tmp/pr71-edits.json').read_text())
          for item in data['records']:
              p=pathlib.Path(item['path'])
              if p.is_absolute() or '..' in p.parts or p.parts[0] not in {'.github','scripts','styles','tests'}: raise SystemExit('Invalid patch path')
              current=p.read_bytes() if p.exists() else None
              digest=hashlib.sha256(current).hexdigest() if current is not None else None
              if item.get('existing'):
                  if digest!=item['after']: raise SystemExit(f'New file hash mismatch {p}: {digest}')
                  continue
              if digest!=item['before']: raise SystemExit(f'Before hash mismatch {p}: {digest}')
              if item['after'] is None:
                  p.unlink()
              else:
                  text=current.decode('utf-8')
                  if item.get('unit')=='characters':
                      for a,b,value in reversed(item['edits']): text=text[:a]+value+text[b:]
                  else:
                      lines=text.splitlines(keepends=True)
                      for a,b,value in reversed(item['edits']): lines[a:b]=[value]
                      text=''.join(lines)
                  if hashlib.sha256(text.encode()).hexdigest()!=item['after']: raise SystemExit('After hash mismatch '+str(p))
                  p.write_text(text)
              subprocess.run(['git','add','-A','--',str(p)],check=True)
          PY
          test -z "$(git diff --name-only --diff-filter=U)"
          git rm .github/pr71-edits.json .github/workflows/pr71-apply.yml
          git diff --cached --check
          git diff --cached --stat
      - name: Build and unit regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repair-output
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          git diff --exit-code -- styles/world.style.json styles/major-stations.geojson
          npm test | tee repair-output/unit.log
          node --check styles/app.mjs
          node --check scripts/check-map-browser.mjs
          node --check scripts/check-map-controls-browser.mjs
      - name: Full-app UI regression matrix
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund maplibre-gl@5.24.0
          npx playwright install --with-deps chromium > repair-output/browser-install.log 2>&1
          node scripts/serve.mjs > repair-output/server.log 2>&1 &
          sleep 2
          node scripts/check-map-controls-browser.mjs 2>&1 | tee repair-output/ui.log
      - name: Commit and publish only after quick checks pass
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/attribution-info-compact | cut -f1)" = "$GITHUB_SHA"
          git diff --cached --check
          git commit -m 'Merge current main and fix responsive ruler layout and attribution state'
          git rev-parse HEAD | tee repair-output/verified-head.txt
          git push origin HEAD:refs/heads/fix/attribution-info-compact
      - name: Preserve diagnostic outputs
        if: always()
        shell: bash
        run: |
          mkdir -p repair-output
          git status --short > repair-output/status.txt
          git diff --cached > repair-output/staged.patch
          tar --exclude=.git --exclude=node_modules --exclude=browser-review --exclude=repair-output -cf /tmp/pr71-working.tar .
          mv /tmp/pr71-working.tar repair-output/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr71-verified-repair
          path: |
            repair-output
            browser-review
          retention-days: 3
